<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

/* ================= timing / script ================= */
const D=await (await fetch("data.json?"+Date.now())).json();
const L=D.lines,ST=D.starts,DUR=D.durs,TOTAL=D.total,CHIP=D.chips;
const N=L.length,SEND=ST.map((s,i)=>i<N-1?ST[i+1]:TOTAL);
document.getElementById("hb").textContent=D.hook;document.getElementById("ttl").textContent=D.footer;

const cl=(v,a,b)=>v<a?a:v>b?b:v, e3=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 eo=x=>1-Math.pow(1-x,3), bk=x=>1+2.70158*Math.pow(x-1,3)+1.70158*Math.pow(x-1,2), lerp=(a,b,p)=>a+(b-a)*p;
const sceneIdx=t=>{for(let i=N-1;i>=0;i--)if(t>=ST[i])return i;return 0};
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

/* ================= renderer ================= */
const W=1080,H=1920,canvas=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true});
R.setPixelRatio(1);R.setSize(W,H,false);R.setClearColor(0x000000,0);
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.08;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.localClippingEnabled=true;
const scene=new THREE.Scene();
const pm=new THREE.PMREMGenerator(R);scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;scene.environmentIntensity=.75;
const cam=new THREE.PerspectiveCamera(34,W/H,1,2000);cam.setViewOffset(W,H,0,170,W,H);

scene.add(new THREE.HemisphereLight(0xd6ecff,0x0b2340,.55));
const key=new THREE.DirectionalLight(0xffffff,2.3);key.position.set(90,170,130);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-95,right:95,top:115,bottom:-40,near:40,far:420});
key.shadow.bias=-.0004;key.shadow.normalBias=.4;key.shadow.radius=4;scene.add(key);
const rim=new THREE.DirectionalLight(0x7fc0ff,1.4);rim.position.set(-120,90,-110);scene.add(rim);
const fill=new THREE.PointLight(0xffe2c4,900,0,1.6);fill.position.set(-60,60,110);scene.add(fill);
const back=new THREE.PointLight(0xcfe6ff,1400,0,1.6);back.position.set(50,70,-80);scene.add(back);

/* floor */
{const g=new THREE.CircleGeometry(400,96);g.rotateX(-Math.PI/2);
 const cv=document.createElement('canvas');cv.width=cv.height=512;const x=cv.getContext('2d');
 const gr=x.createRadialGradient(256,256,0,256,256,256);gr.addColorStop(0,'rgba(120,180,255,.55)');gr.addColorStop(.35,'rgba(60,120,210,.22)');gr.addColorStop(1,'rgba(20,50,100,0)');
 x.fillStyle=gr;x.fillRect(0,0,512,512);
 const glow=new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthWrite:false}));
 glow.position.y=-.05;scene.add(glow);
 const sh=new THREE.Mesh(g.clone(),new THREE.ShadowMaterial({opacity:.42}));sh.receiveShadow=true;scene.add(sh);}

/* ================= materials ================= */
const M=(o)=>new THREE.MeshStandardMaterial(o);
const mk=(geo,mat,parent,pos,rot)=>{const m=new THREE.Mesh(geo,mat);m.castShadow=m.receiveShadow=true;
 if(pos)m.position.set(...pos);if(rot)m.rotation.set(...rot);parent.add(m);return m};
const enamel=()=>M({color:0xf4f7fb,roughness:.32,metalness:0});
const steel=()=>M({color:0xd5dde6,roughness:.24,metalness:.92});
const darkMetal=()=>M({color:0x3b4552,roughness:.42,metalness:.75});
const rubber=()=>M({color:0x15181d,roughness:.85,metalness:0});
const plastic=(c)=>M({color:c,roughness:.45,metalness:0});

/* ================= part system ================= */
const PARTS=[];
function part(name,s,e,off,parent=scene){const g=new THREE.Group();g.name=name;
 const p=new THREE.Group();p.add(g);parent.add(p);
 PARTS.push({g,p,s,e:e??99,off:new THREE.Vector3(...(off||[0,45,0])),hl:[]});return g}
const P=n=>PARTS.find(x=>x.g.name===n);
function hl(name,mesh){const pr=P(name);(Array.isArray(mesh)?mesh:[mesh]).forEach(m=>pr.hl.push(m.material))}

/* ================= EMBER (scene 0-1) ================= */
const bucket=part('bucket',0,2,[0,0,0]);
{const red=M({color:0xe8452c,roughness:.38});
 const wall=mk(new THREE.CylinderGeometry(17,13.5,28,64,1,true),red,bucket,[0,14,0]);wall.material.side=THREE.DoubleSide;wall.receiveShadow=false;
 mk(new THREE.CircleGeometry(13.5,48),red,bucket,[0,.3,0],[-Math.PI/2,0,0]);
 mk(new THREE.TorusGeometry(17.1,.9,16,80),M({color:0xff6a4d,roughness:.35}),bucket,[0,28,0],[Math.PI/2,0,0]);
 const wat=mk(new THREE.CylinderGeometry(15.6,13.0,22,48),M({color:0x3d9cf0,roughness:.08,transparent:true,opacity:.75}),bucket,[0,11.3,0]);wat.castShadow=false;
 const cols=[0xff5c7a,0xffcf3a,0x48c6ff,0x8b6cff,0x3fd18f];
 cols.forEach((c,i)=>{const a=i/5*6.28;mk(lump(5.2),M({color:c,roughness:.95}),bucket,[Math.cos(a)*8,21.5+(i%2)*1.2,Math.sin(a)*8],[i,i*2,0])});
 for(let i=0;i<22;i++){const a=rnd()*6.28,r=4+rnd()*11;mk(new THREE.SphereGeometry(.9+rnd()*1.6,14,10),
   M({color:0xffffff,roughness:.3,transparent:true,opacity:.85}),bucket,[Math.cos(a)*r,22.4+rnd()*1.5,Math.sin(a)*r])}}
function lump(r){const g=new THREE.SphereGeometry(r,36,24),p=g.attributes.position,v=new THREE.Vector3();
 const a=rnd()*9,b=rnd()*9;for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);
  const n=1+.18*Math.sin(v.x*.9+a)*Math.cos(v.y*.8+b)+.1*Math.sin(v.z*1.6+a*b);v.multiplyScalar(n);v.y*=.72;p.setXYZ(i,v.x,v.y,v.z)}
 g.computeVertexNormals();return g}
function hand(side){const g=new THREE.Group(),skin=M({color:0xe2a47c,roughness:.55});
 mk(new THREE.CapsuleGeometry(3.0,70,8,24),skin,g,[0,38,0]);
 mk(new THREE.CylinderGeometry(3.45,3.45,6,28),M({color:0x2f7fd6,roughness:.7}),g,[0,16,0]);
 mk(new RoundedBoxGeometry(7.6,9,3,4,1.4),skin,g,[0,-3.6,0]);
 for(let k=0;k<4;k++)mk(new THREE.CapsuleGeometry(.92,3.6,6,12),skin,g,[-2.8+k*1.87,-10.2+(k===0||k===3?.8:0),.1]);
 mk(new THREE.CapsuleGeometry(1.0,3.4,6,12),skin,g,[side*-4.4,-4.6,.9],[0,0,side*-.55]);
 return g}
const handL=hand(-1),handR=hand(1);bucket.add(handL,handR);

/* ================= MACHINE root ================= */
const cabG=new THREE.Group();scene.add(cabG);
const tubAsm=new THREE.Group();tubAsm.position.set(0,40,0);cabG.add(tubAsm);
const TUB_R=25,TUB_L=38,DR_R=22,DR_L=34;
const winClip=[new THREE.Plane(new THREE.Vector3(-1,0,0),9),new THREE.Plane(new THREE.Vector3(0,0,-1),1)];

/* tub */
const tubP=part('tub',2,99,[0,60,0],tubAsm);
{const m=M({color:0xc4d8ec,roughness:.45,side:THREE.DoubleSide,clippingPlanes:winClip,clipIntersection:true});
 const g=new THREE.CylinderGeometry(TUB_R,TUB_R,TUB_L,72,1,true);g.rotateX(Math.PI/2);mk(g,m,tubP);
 const back=mk(new THREE.CircleGeometry(TUB_R,64),M({color:0xcfd8e2,roughness:.55,side:THREE.DoubleSide}),tubP,[0,0,-TUB_L/2]);
 mk(new THREE.TorusGeometry(TUB_R,1.1,14,90),M({color:0xc7d2de,roughness:.4,clippingPlanes:winClip,clipIntersection:true}),tubP,[0,0,TUB_L/2]);
 for(const z of[-12,0,12])mk(new THREE.TorusGeometry(TUB_R+.35,.6,10,90),M({color:0xb9c6d4,roughness:.4,clippingPlanes:winClip,clipIntersection:true}),tubP,[0,0,z]);
 // window edge highlight
 hl('tub',[]);}

/* drum */
const drumP=part('drum',2,99,[0,70,20],tubAsm);
const drumRot=new THREE.Group();drumP.add(drumRot);
const holeTex=(()=>{const cv=document.createElement('canvas');cv.width=1024;cv.height=256;const x=cv.getContext('2d');
 x.fillStyle='#fff';x.fillRect(0,0,1024,256);x.fillStyle='#000';
 for(let j=0;j<9;j++)for(let i=0;i<44;i++){const ox=(j%2)*11.6;x.beginPath();x.arc(i*23.27+ox+6,j*27+16,5.2,0,7);x.fill()}
 const t=new THREE.CanvasTexture(cv);t.wrapS=THREE.RepeatWrapping;return t})();
const drumMat=M({color:0xe4ebf2,roughness:.22,metalness:.95,alphaMap:holeTex,alphaTest:.5,side:THREE.DoubleSide});
{const g=new THREE.CylinderGeometry(DR_R,DR_R,DR_L,96,1,true);g.rotateX(Math.PI/2);mk(g,drumMat,drumRot);
 const bk_=mk(new THREE.CircleGeometry(DR_R,64),M({color:0xc9d3dd,roughness:.25,metalness:.9}),drumRot,[0,0,-DR_L/2+.1]);
 for(let k=0;k<3;k++){const s=mk(new THREE.BoxGeometry(2.2,DR_R-2,1.2),darkMetal(),drumRot,[0,0,-DR_L/2-.8]);
  s.geometry.translate(0,(DR_R-2)/2,0);s.rotation.z=k*2.094}
 mk(new THREE.CylinderGeometry(3.2,3.2,4,24).rotateX(Math.PI/2),darkMetal(),drumRot,[0,0,-DR_L/2-2]);
 mk(new THREE.TorusGeometry(DR_R,1.1,14,96),steel(),drumRot,[0,0,DR_L/2]);
 for(const z of[-DR_L/2+1,DR_L/2-3])mk(new THREE.TorusGeometry(DR_R+.2,.5,8,96),steel(),drumRot,[0,0,z]);}
hl('drum',drumRot.children[0]);

/* lifters (fins) */
const finP=part('fins',6,99,[0,0,0],drumRot);
{const m=plastic(0x2d8cf0);for(let k=0;k<3;k++){const a=k*2.094+.5;
  const f=mk(new RoundedBoxGeometry(5.2,4.6,DR_L-4,4,1.6),m,finP,[Math.cos(a)*(DR_R-2.4),Math.sin(a)*(DR_R-2.4),0]);
  f.rotation.z=a+Math.PI/2;hl('fins',f)}}

/* clothes inside drum */
const clothes=[];{const cols=[0xff5c7a,0xffcf3a,0x48c6ff,0x8b6cff,0x3fd18f,0xff8a3d];
 const cg=part('clothes',2,99,[0,0,0],drumP);
 cols.forEach((c,i)=>{const m=mk(lump(6),M({color:c,roughness:.95}),cg);clothes.push({m,ph:i*1.047,z:-11+((i*7)%5)*5.2,r:13+((i*3)%3)*1.3})})}

/* water in tub */
const wPlane=new THREE.Plane(new THREE.Vector3(0,-1,0),0);
const waterMat=M({color:0x2f93f0,roughness:.06,metalness:0,transparent:true,opacity:.5,depthWrite:false,side:THREE.DoubleSide,clippingPlanes:[wPlane]});
const water=(()=>{const g=new THREE.CylinderGeometry(TUB_R-.6,TUB_R-.6,TUB_L-1,64,1,false);g.rotateX(Math.PI/2);const m=new THREE.Mesh(g,waterMat);tubAsm.add(m);return m})();
const wTop=new THREE.Mesh(new THREE.PlaneGeometry(1,TUB_L-1),M({color:0x7cc6ff,roughness:.05,transparent:true,opacity:.55,depthWrite:false,side:THREE.DoubleSide}));
wTop.rotation.x=-Math.PI/2;tubAsm.add(wTop);
const foam=[];for(let i=0;i<26;i++){const s=new THREE.Mesh(new THREE.SphereGeometry(.7+rnd()*1.4,12,8),M({color:0xffffff,roughness:.35,transparent:true,opacity:.85}));
 tubAsm.add(s);foam.push({s,x:rnd()*2-1,z:(rnd()*2-1)*15,p:rnd()*6})}

/* droplets through holes (scene 3) */
const drops=[];{const dm=M({color:0x6cc4ff,roughness:.05,transparent:true,opacity:.85});
 for(let i=0;i<28;i++){const d=new THREE.Mesh(new THREE.SphereGeometry(.75,12,8),dm);d.scale.set(1,1.5,1);tubAsm.add(d);
  drops.push({d,a:.2+rnd()*1.3,z:(rnd()*2-1)*14,p:rnd()})}}

/* shaft + seal + big pulley + motor + belt (behind tub) */
const motP=part('motor',4,99,[0,-10,-45],tubAsm);
const pulley=new THREE.Group();pulley.position.set(0,0,-TUB_L/2-9);motP.add(pulley);
{mk(new THREE.CylinderGeometry(1.8,1.8,12,20).rotateX(Math.PI/2),steel(),motP,[0,0,-TUB_L/2-4]);
 const pm_=M({color:0xb8c2cc,roughness:.3,metalness:.9});
 mk(new THREE.CylinderGeometry(17,17,2.2,72).rotateX(Math.PI/2),pm_,pulley);
 mk(new THREE.CylinderGeometry(15.5,15.5,2.6,72).rotateX(Math.PI/2),darkMetal(),pulley);
 for(let k=0;k<5;k++){const sp=mk(new THREE.BoxGeometry(2.4,14,1.6),pm_,pulley);sp.geometry.translate(0,7,0);sp.rotation.z=k*1.2566}
 mk(new THREE.CylinderGeometry(3.4,3.4,3.2,24).rotateX(Math.PI/2),pm_,pulley);}
const motor=new THREE.Group();motor.position.set(0,-30,-9);motP.add(motor);
{const body=M({color:0x55606e,roughness:.4,metalness:.7});
 const b=mk(new THREE.CylinderGeometry(6.5,6.5,18,36).rotateX(Math.PI/2),body,motor);
 for(let k=-3;k<=3;k++)mk(new THREE.TorusGeometry(6.7,.35,8,40),darkMetal(),motor,[0,0,k*2.2]);
 mk(new THREE.CylinderGeometry(6.8,6.8,2,36).rotateX(Math.PI/2),M({color:0x2d3640,roughness:.5,metalness:.6}),motor,[0,0,9.6]);
 mk(new THREE.CylinderGeometry(6.8,6.8,2,36).rotateX(Math.PI/2),M({color:0x2d3640,roughness:.5,metalness:.6}),motor,[0,0,-9.6]);
 mk(new THREE.BoxGeometry(5,3,5),M({color:0xf2a93b,roughness:.5}),motor,[0,7,3]);
 mk(new THREE.CylinderGeometry(.9,.9,12,12).rotateX(Math.PI/2),steel(),motor,[0,0,-14]);
 hl('motor',b);}
const mPul=mk(new THREE.CylinderGeometry(2.6,2.6,2.2,24).rotateX(Math.PI/2),steel(),motP,[0,-30,-TUB_L/2-9]);
const belt=(()=>{const pts=[],R1=17.1,R2=2.7,cy2=-30,n=40;
 const d=Math.abs(cy2),a=Math.acos((R1-R2)/d);
 for(let i=0;i<=n;i++){const t=-a+i/n*(2*Math.PI-2*a)*-1;}
 // build path: big arc (top), tangent, small arc (bottom), tangent
 const big=[],small=[];for(let i=0;i<=48;i++){const th=(-Math.PI/2+a)+i/48*(2*Math.PI-2*a);big.push(new THREE.Vector3(Math.cos(th)*R1,Math.sin(th)*R1,0))}
 for(let i=0;i<=12;i++){const th=(-Math.PI/2-a)+i/12*(2*a);small.push(new THREE.Vector3(Math.cos(th+Math.PI)*-R2*-1,cy2+Math.sin(th)*R2,0))}
 const path=[...big,...small.reverse()];const curve=new THREE.CatmullRomCurve3(path,true);
 const g=new THREE.TubeGeometry(curve,220,.75,8,true);const m=mk(g,rubber(),motP,[0,0,-TUB_L/2-9]);m.scale.z=1.6;hl('motor',m);return m})();
const sealP=part('seal',5,99,[0,0,-30],tubAsm);
{const sm=M({color:0x2a2e35,roughness:.6,emissive:0xff3b3b,emissiveIntensity:0});
 mk(new THREE.TorusGeometry(4.2,1.7,20,48),sm,sealP,[0,0,-TUB_L/2-1.2]);
 mk(new THREE.CylinderGeometry(5.5,5.5,1.4,40).rotateX(Math.PI/2),darkMetal(),sealP,[0,0,-TUB_L/2-.2]);
 hl('seal',sealP.children[0]);}

/* cabinet: base + back (scene 4) */
const baseP=part('base',4,99,[0,-30,0],cabG);
{const e=enamel();mk(new RoundedBoxGeometry(60,3,58,3,1),M({color:0x9aa7b6,roughness:.5,metalness:.4}),baseP,[0,1.5,0]);
 for(const x of[-26,26])for(const z of[-25,25])mk(new THREE.CylinderGeometry(2.2,2.6,2,16),rubber(),baseP,[x,-.4,z]);
 }

/* inlet valve (scene 7) */
const valP=part('valve',7,99,[30,40,0],cabG);
let stream;{const body=plastic(0x2b333d);
 mk(new RoundedBoxGeometry(9,5,6,3,1.2),body,valP,[18,78,-24]);
 for(const x of[15.6,20.4]){const c=mk(new THREE.CylinderGeometry(2.1,2.1,5,24),M({color:0xd9a441,roughness:.3,metalness:.85}),valP,[x,82,-24]);hl('valve',c)}
 mk(new THREE.CylinderGeometry(1.6,1.6,7,16).rotateZ(Math.PI/2),M({color:0xd9a441,roughness:.3,metalness:.85}),valP,[25,78,-24]);
 const c=new THREE.CatmullRomCurve3([new THREE.Vector3(13.5,78,-24),new THREE.Vector3(6,76,-18),new THREE.Vector3(2,72,-4),new THREE.Vector3(0,67,8),new THREE.Vector3(0,64.5,12)]);
 hl('valve',mk(new THREE.TubeGeometry(c,60,1.25,12),M({color:0xe8eef5,roughness:.35,transparent:true,opacity:.92}),valP));
 mk(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(29,78,-24),new THREE.Vector3(40,78,-27),new THREE.Vector3(60,90,-35)]),40,1.3,10),rubber(),valP);
 stream=new THREE.Mesh(new THREE.CylinderGeometry(.9,.6,1,16),M({color:0x7ccaff,roughness:.05,transparent:true,opacity:.75}));tubAsm.add(stream);}

/* pressure sensor (scene 8) */
const presP=part('press',8,99,[-30,30,0],cabG);
let pTube;{mk(new THREE.CylinderGeometry(4.2,4.2,3,32).rotateX(Math.PI/2),plastic(0x6b4cff),presP,[-22,76,-26]);
 mk(new THREE.CylinderGeometry(4.6,4.6,.8,32).rotateX(Math.PI/2),plastic(0xffffff),presP,[-22,76,-24.2]);
 const c=new THREE.CatmullRomCurve3([new THREE.Vector3(-22,72,-25),new THREE.Vector3(-27,60,-20),new THREE.Vector3(-27,30,-10),new THREE.Vector3(-18,17,-6),new THREE.Vector3(-6,15.2,-6)]);
 pTube=mk(new THREE.TubeGeometry(c,80,.85,10),M({color:0xc9b8ff,roughness:.2,transparent:true,opacity:.8}),presP);
 hl('press',[presP.children[0],pTube]);}
const pBall=new THREE.Mesh(new THREE.SphereGeometry(1.05,12,10),M({color:0x7cc6ff}));presP.add(pBall);

/* drain pump (scene 9) */
const pumpP=part('pump',9,99,[-30,0,20],cabG);
const imp=new THREE.Group();{const g=plastic(0x22a066);
 const vol=mk(new THREE.CylinderGeometry(5.6,5.6,4.4,40).rotateX(Math.PI/2),M({color:0x2fbf7a,roughness:.35,transparent:true,opacity:.55}),pumpP,[-14,8,16]);vol.castShadow=false;
 mk(new THREE.TorusGeometry(5.6,.6,10,40),g,pumpP,[-14,8,18.2]);
 mk(new THREE.CylinderGeometry(3.8,3.8,8,28).rotateX(Math.PI/2),M({color:0x3c4652,roughness:.4,metalness:.6}),pumpP,[-14,8,10]);
