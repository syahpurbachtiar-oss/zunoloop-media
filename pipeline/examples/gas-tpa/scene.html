R.setPixelRatio(1);R.setSize(W,H,false);R.setClearColor(0,0);R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;

/* ================= helper ================= */
const ctex=(w,h,draw,rep=[1,1])=>{const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);

const Ms=o=>new THREE.MeshStandardMaterial(o);

const mk=(g,mat,p,pos,rot,sc)=>{const o=new THREE.Mesh(g,mat);o.castShadow=o.receiveShadow=true;if(pos)o.position.set(...pos.map(m));if(rot)o.rotation.set(...rot);if(sc)o.scale.set(...sc);if(p)p.add(o);return o};

const _unusedVT=col=>ctex(256,256,(c,w,h)=>{c.fillStyle=col;c.fillRect(0,0,w,h);c.fillStyle='rgba(0,0,0,.08)';c.fillRect(0,236,w,20);

/* ---------- bahan & helper ---------- */
const softTex=(a0,a1)=>ctex(64,64,(c,w,h)=>{const g=c.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,`rgba(255,255,255,${a0})`);g.addColorStop(.55,`rgba(255,255,255,${a1})`);g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,w,h)});

// sepeda statis (dibangun dari ukuran tubuh pengendara: sadel = pinggul, engkol = 0,70L bawah / 0,22L depan), menghadap +x
function exBike(parent,c,x,z){const g=new THREE.Group();g.position.set(m(x),0,m(z));parent.add(g);
 c.act('cycle',0,'normal');const L_=c.legs[0].th+c.legs[0].sh,hipY=c.legLen;/* satuan scene, relatif kaki berdiri */
 const saddleTop=.62;/* m */ const rootY=m(saddleTop)+c.k*3.0-hipY;const ck=V(.22*L_,rootY+hipY-.70*L_,0);/* posisi engkol (lokal sepeda, x = depan) */
 const F=Ms({color:0x2a2f36,roughness:.45,metalness:.4});
 mk(box(1.1,.05,.08),F,g,[.05,.025,0]);for(const xx of[-.45,.55])mk(box(.06,.05,.5),F,g,[xx,.025,0]);

 const sad=V(-m(.02),m(saddleTop),0),cw=ck.clone();post(V(-m(.1),m(.05),0),sad.clone().add(V(0,-m(.04),0)));post(V(-m(.05),m(.05),0),cw);post(cw,V(m(.5),m(1.0),0));post(V(m(.5),m(.05),0),V(m(.5),m(1.0),0),.03);
 mk(box(.26,.05,.16,.02),Ms({color:0x16181b,roughness:.7}),g,[-.02,saddleTop-.005,0]);mk(box(.06,.04,.5,.01),F,g,[.5,1.02,0]);for(const sd of[-1,1])mk(cyl(.018,.018,.12,10),Ms({color:0x16181b}),g,[.5,1.02,sd*.22],[PI/2,0,0]);
 const fly=mk(zcyl(.2,.2,.05,32),MET({color:0x8d939a,metalness:.8,roughness:.3}),g,[.38,.32,0]);mk(box(.14,.2,.1),F,g,[.38,.12,0]);
 const crank=new THREE.Group();crank.position.copy(cw);g.add(crank);const R_=.17*L_;
 for(const sd of[-1,1]){const arm=new THREE.Group();arm.position.z=sd*m(.08);crank.add(arm);const a=mk(new THREE.BoxGeometry(1,1,1),STEEL,arm);a.scale.set(R_,m(.02),m(.012));a.position.x=R_/2;const pd=mk(box(.1,.025,.06),Ms({color:0x16181b}),arm);pd.position.set(R_,0,sd*m(.04));arm.userData.sd=sd}
 g.userData={crank,rootY,fly};return g}

 const sh=new THREE.Shape([[-1.82,.9],[.8,.9],[.02,1.44],[-1.6,1.46]].map(q=>new THREE.Vector2(m(q[0]),m(q[1]))));
 const cab=new THREE.ExtrudeGeometry(sh,{depth:m(1.42),bevelEnabled:true,bevelThickness:m(.03),bevelSize:m(.03),bevelSegments:3});cab.translate(0,0,-m(.71));mk(cab,[PAINT,GL],g);
 mk(box(1.56,.05,1.46,.02),PAINT,g,[-.79,1.49,0]);/* atap */

  mk(box(.07,.42,.01),PAINT,g,[-.55,1.19,sd*.752]);mk(box(.015,.5,.004),TRIM,g,[-.55,.62,sd*.852]);mk(box(.015,.5,.004),TRIM,g,[.45,.62,sd*.852]);mk(box(.12,.025,.02),TRIM,g,[-.2,.8,sd*.86]);mk(box(.12,.025,.02),TRIM,g,[.75,.8,sd*.86]);

 mk(box(.14,.22,1.72,.05),TRIM,g,[-1.86,.42,0]);mk(box(.14,.22,1.72,.05),TRIM,g,[1.86,.42,0]);/* bemper */
 for(const sd of[-1,1]){mk(box(.04,.14,.26,.02),Ms({color:0xc81e1e,emissive:0x7a0d0d,emissiveIntensity:.6,roughness:.3}),g,[-1.905,.78,sd*.64]);mk(box(.04,.12,.3,.02),Ms({color:0xfff4d8,emissive:0xfff4d8,emissiveIntensity:.4}),g,[1.905,.76,sd*.6])}
 mk(box(.03,.12,.34),Ms({color:0xf2f2f0,roughness:.4}),g,[-1.94,.62,0]);mk(box(.03,.12,.5),TRIM,g,[1.92,.62,0]);/* pelat nomor polos, gril */
 mk(xcyl(.026,.026,.5,16),DSTEEL,g,[-1.75,.22,.45]);mk(xcyl(.03,.03,.06,16,true),MET({color:0x3a3d42,metalness:.7,roughness:.4,side:THREE.DoubleSide}),g,[-1.98,.22,.45]);
 mk(new THREE.CircleGeometry(m(.026),16).rotateY(-PI/2),Ms({color:0x0d0e10}),g,[-1.995,.22,.45]);
 return g}


/* ================= SET 1: PUENTE HILLS (bukit TPA, sumur gas, pembangkit, perumahan) ================= */
const hill=outdoor('#8ec2ea','#e6ecee',700,2400);AS.sun(hill,[-300,420,260],420,2.5);AS.ground(hill,6000,'dirt');
// profil bukit bertingkat (meter): [jari-jari, tinggi]
const PROF=[[540,0],[455,38],[432,40],[350,78],[328,80],[245,113],[224,115],[135,140],[60,149],[0,150]];
const HX=1.45;
const hillY=(x,z)=>{const r=Math.hypot(x/HX,z);for(let i=0;i<PROF.length-1;i++){const [r0,y0]=PROF[i],[r1,y1]=PROF[i+1];if(r<=r0&&r>=r1)return y0+(y1-y0)*(r0-r)/(r0-r1)}return r<0?150:0};
const grassT=ctex(256,256,(c,w,h)=>{c.fillStyle='#9a9a62';c.fillRect(0,0,w,h);for(let i=0;i<6000;i++){c.fillStyle=['#8a8c56','#a8a46c','#7f8450','#b0a874','#94965e'][i%5];c.fillRect(hash(i*2+.1)*w,hash(i*2+.3)*h,2,2)}},[40,40]);
const HILL=mk(new THREE.LatheGeometry(PROF.map(([r,y])=>new THREE.Vector2(m(r),m(y))),96),Ms({color:0xffffff,map:grassT,roughness:1,side:THREE.DoubleSide}),hill,[0,0,0],null,[HX,1,1]);HILL.receiveShadow=true;
// jalan tanah di teras

for(let i=0;i<90;i++){const a=hash(i+1)*PI*2,rr=60+hash(i+2)*440,x=Math.cos(a)*rr*HX,z=Math.sin(a)*rr,y=hillY(x,z);const w=new THREE.Group();w.position.set(m(x),m(y),m(z));wellG.add(w);mk(cyl(.15,.15,1.4,10),Ms({color:0x2a2c30,roughness:.6}),w,[0,.7,0]);mk(box(.36,.22,.36),Ms({color:0xd8dde2,roughness:.4}),w,[0,1.45,0]);mk(cyl(.05,.05,.3,8).rotateZ(PI/2),Ms({color:0xe0302a}),w,[.28,1.45,0]);WELLS.push([x,y,z])}
// pipa pengumpul (HDPE hitam) menuruni lereng ke stasiun blower
const HW=[];
const BLW=[820,0,120];
for(let k=0;k<5;k++){const a0=-.5+k*.32,pts=[];for(let s=0;s<=24;s++){const rr=80+s*19,a=a0+s*.01*(k-2),x=Math.cos(a)*rr*HX,z=Math.sin(a)*rr;pts.push(V(m(x),m(hillY(x,z)+.25),m(z)))}for(let s2=2;s2<24;s2+=3){const q=pts[s2];const w=new THREE.Group();w.position.set(q.x+m(1.2),q.y-m(.25),q.z);wellG.add(w);mk(cyl(.15,.15,1.4,10),Ms({color:0x2a2c30,roughness:.6}),w,[0,.7,0]);mk(box(.36,.22,.36),Ms({color:0xd8dde2,roughness:.4}),w,[0,1.45,0]);mk(cyl(.05,.05,.3,8).rotateZ(PI/2),Ms({color:0xe0302a}),w,[.28,1.45,0]);mk(cyl(.06,.06,1.3,8).rotateZ(PI/2),Ms({color:0x1c1d20}),w,[-.6,.3,0]);if(k===2&&s2===11)HW.push(w)}pts.push(Cm(BLW[0]-10,.3,BLW[2]+(k-2)*3));mk(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),120,m(.3),8),Ms({color:0x1c1d20,roughness:.55}),hill)}
// stasiun blower + suar
const STN=new THREE.Group();hill.add(STN);STN.position.set(m(BLW[0]),0,m(BLW[2]));mk(box(16,6,10),Ms({color:0xd9d6cc,roughness:.8}),STN,[0,3,0]);for(let i=0;i<3;i++){mk(cyl(1.2,1.2,2.4,20).rotateZ(PI/2),Ms({color:0x2f6bb0,roughness:.5}),STN,[-4+i*4,1.4,7.5]);mk(new THREE.TorusGeometry(m(.9),m(.15),8,20).rotateY(PI/2),DSTEEL,STN,[-4+i*4+1.25,1.4,7.5])}

mk(cyl(2.2,2.6,48,20),Ms({color:0xbab6ae,roughness:.7}),PLANT,[-14,24,-6]);for(let i=0;i<3;i++)mk(box(4,4,3,.2),Ms({color:0x6b7a5a,roughness:.6}),PLANT,[28+i*5,2,6]);
const PST=puffs(PLANT,10,6,0xf2f2f2,.45);
COL.solid(PLANT.children[0],null,'pembangkit');
// pipa gas induk stasiun → pembangkit
