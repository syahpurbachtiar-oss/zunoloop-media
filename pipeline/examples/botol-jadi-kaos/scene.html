<script type="module">
import * as THREE from 'three';

const D=await (await fetch("data.json?"+Date.now())).json();
const L=D.lines,N=L.length;
const ST=D.starts,DUR=D.durs,TOTAL=D.total;
const PI=Math.PI,cl=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,p)=>a+(b-a)*p,e3=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,eo=x=>1-Math.pow(1-x,3);
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

/* ================= renderer ================= */
const W=1080,H=1920,canvas=document.getElementById('c');

cam.near=m(.05);cam.far=m(2000);cam.updateProjectionMatrix();

/* ================= helper ================= */
const ctex=(w,h,draw,rep=[1,1])=>{const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);
 t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...rep);return t};
const Ms=o=>new THREE.MeshStandardMaterial(o);
const PO={polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-4};
const mk=(g,mat,p,pos,rot,sc)=>{const o=new THREE.Mesh(g,mat);o.castShadow=o.receiveShadow=true;if(pos)o.position.set(...pos.map(m));if(rot)o.rotation.set(...rot);if(sc)o.scale.set(...sc);if(p)p.add(o);return o};
const box=(w,h,d,r=0)=>r?new RBG(m(w),m(h),m(d),3,m(r)):new THREE.BoxGeometry(m(w),m(h),m(d));
const cyl=(rt,rb,h,s=24,open=false)=>new THREE.CylinderGeometry(m(rt),m(rb),m(h),s,1,open);
function sky(top,bot){return ctex(4,256,(c,w,h)=>{const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,top);g.addColorStop(.62,bot);g.addColorStop(1,bot);c.fillStyle=g;c.fillRect(0,0,w,h)})}
function outdoor(top,bot,fn,ff){const s=new THREE.Scene();s.background=sky(top,bot);s.fog=new THREE.Fog(new THREE.Color(bot),m(fn),m(ff));s.add(new THREE.HemisphereLight(0xdff0ff,0x7f8a66,1.35));return s}
// aula pabrik: dinding BackSide + lantai beton polygonOffset (tidak sebidang), lampu atap
function hall(w,d,h,wallCol){const s=new THREE.Scene();s.background=new THREE.Color(0xdfe4e8);s.add(new THREE.HemisphereLight(0xffffff,0x9aa3ab,1.25));
 mk(box(w,h,d),Ms({color:wallCol,roughness:.85,side:THREE.BackSide}),s,[0,h/2,0]).castShadow=false;
 mk(new THREE.PlaneGeometry(m(w-.2),m(d-.2)).rotateX(-PI/2),Ms({...PO,color:0xffffff,roughness:.9,map:ctex(256,256,(c,W_,H_)=>{c.fillStyle='#a9aaa6';c.fillRect(0,0,W_,H_);for(let i=0;i<5000;i++){c.fillStyle=['#9c9d99','#b4b5b1','#a2a39f'][i%3];c.fillRect(Math.random()*W_,Math.random()*H_,2,2)}c.fillStyle='rgba(242,194,48,.9)';c.fillRect(0,120,W_,6)},[w/8,d/8])}),s,[0,.02,0]);
 for(let x=-w/2+6;x<w/2;x+=10)for(let z=-d/2+6;z<d/2;z+=10){mk(box(1.6,.12,.5),Ms({color:0xffffff,emissive:0xffffff,emissiveIntensity:.9}),s,[x,h-.3,z])}
 AS.sun(s,[-10,h-1,8],Math.max(w,d)*.6,1.7);return s}
// dots = HANYA butiran padat (serpihan plastik, tutup botol, butiran chip, molekul) — BUKAN cairan
function dots(sc,n,geo,mat){const im=new THREE.InstancedMesh(geo,mat,n);im.frustumCulled=false;im.castShadow=true;sc.add(im);const o=new THREE.Object3D();
 return {im,set(fn){for(let k=0;k<n;k++){const p=fn(k);o.position.copy(p);const s_=p.s===undefined?1:p.s;o.scale.setScalar(Math.max(1e-4,s_));o.rotation.set(k*1.3+(p.r||0),k*2.1,k*.7);o.updateMatrix();im.setMatrixAt(k,o.matrix);if(p.c)im.setColorAt(k,p.c)}im.instanceMatrix.needsUpdate=true;if(im.instanceColor)im.instanceColor.needsUpdate=true}}}
const villageTex=col=>ctex(256,256,(c,w,h)=>{c.fillStyle=col;c.fillRect(0,0,w,h);c.fillStyle='rgba(0,0,0,.08)';c.fillRect(0,236,w,20);
 for(const x0 of[26,170]){c.fillStyle='#f4f4f0';c.fillRect(x0-5,85,70,82);c.fillStyle='#41556b';c.fillRect(x0,90,60,72);c.fillStyle='#f4f4f0';c.fillRect(x0+28,90,4,72);c.fillRect(x0,124,60,4)}
 c.fillStyle='#7a2f2a';c.fillRect(104,110,48,146);c.fillStyle='#d9b26a';c.fillRect(142,180,5,5)});

/* ---------- benda: botol PET 600 mL (tinggi 22 cm, Ø 6,5 cm) ---------- */
const PET=Ms({color:0xcfe6f2,roughness:.05,metalness:.05,transparent:true,opacity:.42,depthWrite:false});
const CAPC=[0x2f6bd6,0xd23a2a,0x1fbf5f,0xf2c230];
const labTex=ctex(128,32,(c,w,h)=>{c.fillStyle='#3a8fd6';c.fillRect(0,0,w,h);c.fillStyle='#fff';c.fillRect(0,12,w,8)});
function petBottle(parent,{cap=0,label=true,crushed=0}={}){const g=new THREE.Group();if(parent)parent.add(g);
 const prof=[[0,0],[.032,0],[.033,.005],[.033,.15],[.028,.17],[.016,.2],[.0125,.205],[.0125,.215]].map(([r,y])=>new THREE.Vector2(m(r),m(y)));
 const b=mk(new THREE.LatheGeometry(prof,20),PET,g);b.scale.set(1,1-crushed*.55,1+crushed*.35);
 if(label)mk(cyl(.0335,.0335,.06,20,true),Ms({color:0xffffff,map:labTex,roughness:.5,side:THREE.DoubleSide}),g,[0,.08*(1-crushed*.55),0],null,[1,1,1+crushed*.35]);
 mk(cyl(.0145,.0145,.02,16),Ms({color:CAPC[cap%4],roughness:.5}),g,[0,(.205-crushed*.1)+.012,0]);
 g.userData.capY=m(.217);return g}
function jacket(col){const s=new THREE.Shape();const P=[[-.12,0],[-.24,-.03],[-.33,-.12],[-.42,-.62],[-.34,-.64],[-.26,-.25],[-.26,-.72],[.26,-.72],[.26,-.25],[.34,-.64],[.42,-.62],[.33,-.12],[.24,-.03],[.12,0],[.0,-.1]];
 s.moveTo(m(P[0][0]),m(P[0][1]));P.slice(1).forEach(([x,y])=>s.lineTo(m(x),m(y)));s.closePath();const g=new THREE.Group();const geo=new THREE.ExtrudeGeometry(s,{depth:m(.02),bevelEnabled:true,bevelThickness:m(.01),bevelSize:m(.01),bevelSegments:2});
 mk(geo,Ms({color:col,roughness:.7}),g);mk(box(.012,.7,.01),Ms({color:0x8d939a,metalness:.7,roughness:.3}),g,[0,-.37,.035]);return g}
// kaos: kain poliester, digantung dari kerah (origin = tengah kerah, sumbu kerah sepanjang X, badan ke -Y)
function tshirt(col=0x2f8a52){/* kain = bidang rapat 48x48 + siluet alphaMap: lipatan halus, bukan faset kardus */const P=[[-.13,0],[-.23,-.03],[-.36,-.13],[-.3,-.24],[-.25,-.2],[-.25,-.7],[.25,-.7],[.25,-.2],[.3,-.24],[.36,-.13],[.23,-.03],[.13,0],[.1,-.045],[.05,-.065],[0,-.07],[-.05,-.065],[-.1,-.045]];
 const W=.76,H=.74,px=(x)=>(x+W/2)/W*256,py=(y)=>(-y+.01)/H*256;
 const am=ctex(256,256,(c,w,h)=>{c.fillStyle='#000';c.fillRect(0,0,w,h);c.fillStyle='#fff';c.beginPath();P.forEach(([x,y],i)=>i?c.lineTo(px(x),py(y)):c.moveTo(px(x),py(y)));c.closePath();c.fill()});
 const geo=new THREE.PlaneGeometry(m(W),m(H),48,48);geo.translate(0,-m(H/2-.01),0);
 {const q=geo.attributes.position;for(let i=0;i<q.count;i++){const x=q.getX(i)/U,y=q.getY(i)/U;q.setZ(i,m(.012*Math.sin(x*11+y*3)+.008*Math.sin(y*9+1)+.01*Math.cos(x*4)))}geo.computeVertexNormals()}
 const kain=Ms({color:col,roughness:.95,side:THREE.DoubleSide,alphaMap:am,alphaTest:.5,map:ctex(64,64,(c,w,h)=>{c.fillStyle='#ffffff';c.fillRect(0,0,w,h);c.fillStyle='rgba(0,0,0,.07)';for(let i=0;i<w;i+=3)c.fillRect(i,0,1,h)},[8,8])});
 const g=new THREE.Group();mk(geo,kain,g);
 /* kerah rib: pita tipis mengikuti garis leher */{const cp=new THREE.CatmullRomCurve3([[-.13,0],[-.1,-.045],[-.05,-.065],[0,-.07],[.05,-.065],[.1,-.045],[.13,0]].map(([x,y])=>new THREE.Vector3(m(x),m(y),m(.012*Math.sin(x*11+y*3)+.008*Math.sin(y*9+1)+.01*Math.cos(x*4)))));mk(new THREE.TubeGeometry(cp,24,m(.007),6),Ms({color:col,roughness:.9}),g)}
 return g}

/* ================= SET 1: RUMAH (halaman depan, tong sampah) ================= */
const home=outdoor('#86bdf0','#d6e8f4',60,300);AS.sun(home,[-20,30,25],18);AS.ground(home,600,'grass');
AS.house(home,{x:0,z:-5,w:8,d:7,h:3.2,wall:'#e8e2d6',roof:0x5b5f66}).userData.wallMat.map=villageTex('#e8e2d6');
AS.paving(home,0,1.2,7,5,'#c7c3ba');
const binG=new THREE.Group();binG.position.set(m(1.6),m(.03),m(.6));home.add(binG);
mk(cyl(.29,.25,.9,28,true),Ms({color:0x3a3f46,roughness:.6,side:THREE.DoubleSide}),binG,[0,.45,0]);mk(new THREE.CircleGeometry(m(.285),28).rotateX(-PI/2),Ms({color:0x2a2f36}),binG,[0,.5,0]);mk(new THREE.TorusGeometry(m(.29),m(.015),6,28),Ms({color:0x2a2f36}),binG,[0,.9,0],[PI/2,0,0]);{const lid=new THREE.Group();lid.position.set(0,m(.9),m(-.29));lid.rotation.x=-1.95;binG.add(lid);mk(cyl(.31,.31,.05,28),Ms({color:0x2a2f36,roughness:.6}),lid,[0,0,.3])}
const trash=new THREE.Group();binG.add(trash);for(let k=0;k<14;k++){const b=petBottle(trash,{cap:k,crushed:hash(k)});b.position.set(m((hash(k+1)-.5)*.3),m(.56+hash(k+2)*.2),m((hash(k+3)-.5)*.3));b.rotation.set(1.4+hash(k),hash(k+4)*6,hash(k+5))}
for(let k=0;k<6;k++)mk(new THREE.IcosahedronGeometry(m(.07),0),Ms({color:[0x3a3a3a,0x5b5348,0x8d8f8a][k%3],roughness:.9}),trash,[(hash(k+9)-.5)*.3,.56+hash(k+11)*.12,(hash(k+12)-.5)*.3]);
const line=new THREE.Group();line.position.set(m(-1.9),0,m(.4));home.add(line);for(const x of[-1.1,1.1])mk(cyl(.025,.03,1.9,10),AS.MAT.steel,line,[x,.95,0]);mk(cyl(.004,.004,2.2,6),Ms({color:0xf2f2ee}),line,[0,1.8,0],[0,0,PI/2]);
const shirtL=tshirt(0x2f8a52);shirtL.position.set(m(.1),m(1.79),0);line.add(shirtL);for(const x of[-.1,.3])mk(box(.012,.07,.02),Ms({color:0xf2c230}),line,[x-0.0,1.79,.012]);
const heldBottle=new THREE.Group();petBottle(heldBottle,{cap:0}).position.y=-m(.11);/* digenggam di tengah badan botol */const shirt=tshirt(0x2f8a52);
const dropB=petBottle(home,{cap:0});dropB.visible=false;
AS.tree(home,-7,-8,1.2);AS.tree(home,8,-10,1.1);AS.tree(home,-8,6,1);AS.tree(home,9,5,1.1);

/* ================= SET 2: TEMPAT PILAH (truk + mesin pres bal) ================= */
const mrf=outdoor('#86bdf0','#d6e8f4',90,500);AS.sun(mrf,[-30,40,30],35);AS.ground(mrf,900,'dirt');
AS.paving(mrf,0,0,60,40,'#aeaba4');
{const sh=new THREE.Group();mrf.add(sh);mk(box(30,10,.3),Ms({color:0xc9ced2,roughness:.6}),sh,[0,5,-12]);mk(box(32,.5,16),Ms({color:0x8d939a,roughness:.5,metalness:.4}),sh,[0,10.2,-5]);for(const x of[-15,15])for(const z of[-12,2])mk(box(.4,10,.4),AS.MAT.steel,sh,[x,5,z])}
const truck=AS.garbageTruck(mrf);truck.position.set(m(-9),0,m(10));truck.rotation.y=PI*.2;
// bal botol: ±1,2 × 1 × 0,8 m, botol gepeng diikat kawat
const baleTex=ctex(256,256,(c,w,h)=>{c.fillStyle='#9fc3d4';c.fillRect(0,0,w,h);for(let i=0;i<260;i++){const x=Math.random()*w,y=Math.random()*h;c.fillStyle=['#cfe6f2','#7fb0c8','#e8f3f8','#3a8fd6','#d23a2a','#2f6bd6','#f2f2f2'][i%7];c.save();c.translate(x,y);c.rotate(Math.random()*3);c.fillRect(-14,-4,28,8);c.restore()}});
const BALE=Ms({color:0xffffff,map:baleTex,roughness:.35});
function bale(parent,x,y,z,ry=0){const g=new THREE.Group();g.position.set(m(x),m(y),m(z));g.rotation.y=ry;parent.add(g);mk(box(1.2,1,.8,.05),BALE,g,[0,.5,0]);for(const yy of[.25,.5,.75])mk(new THREE.TorusGeometry(m(.72),m(.006),4,4),AS.MAT.dark,g,[0,yy,0],[PI/2,0,PI/4],[1,.66,1]);return g}
for(let i=0;i<5;i++)for(let j=0;j<3;j++)bale(mrf,4+i*1.3,j*1.0,-6,0);for(let i=0;i<4;i++)for(let j=0;j<2;j++)bale(mrf,4.6+i*1.3,j*1.0,-4.9,0);
// mesin pres
const baler=new THREE.Group();baler.position.set(m(-4),0,m(-5));mrf.add(baler);
mk(box(2.2,2.4,4,.1),Ms({color:0xf2c230,roughness:.5,metalness:.3}),baler,[0,1.2,0]);mk(box(1.6,1.6,1.4),AS.MAT.dark,baler,[0,3,-1]);mk(box(1.5,1.1,.9),Ms({color:0x2a2f36}),baler,[0,.55,2.3]);
const pressHead=mk(box(1.4,.2,1.2),AS.MAT.steel,baler,[0,2.3,1.2]);
const conv=new THREE.Group();conv.position.set(m(-4),0,m(-5));mrf.add(conv);
{const g=mk(box(.9,.1,7),Ms({color:0x2a2f36,roughness:.6}),conv,[0,0,0]);g.position.set(0,m(1.6),m(-5));g.rotation.x=-.32;for(const z of[-7.5,-3])mk(box(.12,1.6,.12),AS.MAT.steel,conv,[.4,.8,z])}
const loose=new THREE.Group();mrf.add(loose);for(let k=0;k<160;k++){const b=petBottle(loose,{cap:k,crushed:hash(k)*.6});{const a=hash(k)*PI*2,r=Math.sqrt(hash(k+2))*1.8;b.position.set(m(-6+Math.cos(a)*r),m(.04+(1-r/1.8)*.9*hash(k+1)+.03),m(Math.sin(a)*r))}b.rotation.set(PI/2,hash(k+3)*6,hash(k+4)*6)}
AS.tree(mrf,-30,-30,1.4);AS.tree(mrf,30,-28,1.3);AS.tree(mrf,-32,18,1.2);

/* ================= SET 3: PABRIK REIDSVILLE (sortir, cuci, cacah, bak apung) ================= */
const reid=hall(60,40,11,0xe9ece8);
const bale2=bale(reid,-20,0,8,0);const fork=new THREE.Group();reid.add(fork);
mk(box(1.2,1.1,2.2,.12),Ms({color:0xf28c28,roughness:.5}),fork,[0,.9,0]);mk(box(1.1,.8,.06),AS.MAT.glass,fork,[0,1.9,.4]);for(const x of[-.5,.5])mk(box(.06,2,.06),AS.MAT.dark,fork,[x,2,-.2]);mk(box(1.2,.05,1.2),AS.MAT.dark,fork,[0,2.95,-.2]);
mk(box(.9,2.4,.08),AS.MAT.dark,fork,[0,1.2,1.25]);for(const x of[-.3,.3])mk(box(.1,.05,1.1),AS.MAT.steel,fork,[x,.2,1.8]);for(const [x,z] of[[-.55,.7],[.55,.7],[-.55,-.8],[.55,-.8]])mk(cyl(.3,.3,.22,18),AS.MAT.rubber,fork,[x,.3,z],[0,0,PI/2]);
// sabuk berjalan botol kotor
const belt=new THREE.Group();belt.position.set(0,0,m(2));reid.add(belt);mk(box(24,.12,1.2),Ms({color:0x22262b,roughness:.7}),belt,[0,1.1,0]);for(let x=-11;x<=11;x+=2.2)for(const z of[-.5,.5])mk(box(.1,1.05,.1),AS.MAT.steel,belt,[x,.52,z]);
for(const z of[-.65,.65])mk(box(24,.18,.06),Ms({color:0xf2c230,roughness:.5}),belt,[0,1.2,z]);
const beltB=[];for(let k=0;k<60;k++){const b=petBottle(belt,{cap:k,crushed:hash(k)*.4});b.rotation.set(hash(k)*6,0,PI/2+(hash(k+2)-.5)*.8);beltB.push(b)}
const dirt=Ms({color:0x8a6a3a,roughness:.9,transparent:true,opacity:.75});beltB.forEach((b,k)=>{if(k%3==0)mk(new THREE.SphereGeometry(m(.02),8,6),dirt,b,[.01,.06,.02],null,[1.4,.4,1])});
// mesin cacah (granulator) + bak apung (dilihat dari luar)
const gran=new THREE.Group();gran.position.set(m(14),0,m(2));reid.add(gran);mk(box(3,3,3,.1),Ms({color:0x2f6bd6,roughness:.45,metalness:.3}),gran,[0,1.5,0]);mk(new THREE.CylinderGeometry(m(1.4),m(.6),m(1.4),4,1,true),Ms({color:0x8d939a,metalness:.5,roughness:.4,side:THREE.DoubleSide}),gran,[0,3.7,0],[0,PI/4,0]);
const tankR=new THREE.Group();tankR.position.set(m(8),0,m(-10));reid.add(tankR);mk(box(10,1.6,2.4,.05),Ms({color:0xcfd6dd,roughness:.35,metalness:.6}),tankR,[0,.8,0]);
for(const x of[-4,4])mk(box(.15,1.2,.15),AS.MAT.steel,tankR,[x,2.2,0]);mk(box(9,.12,.6),AS.MAT.steel,tankR,[0,2.85,0]);
AS.pipe(reid,[[14,3,0.5],[14,4.5,-4],[8,4.5,-9],[8,2,-9]],.25,AS.MAT.steel);

/* ================= SET 4: PENAMPANG (benda dibelah: mesin cacah, bak apung, ekstruder, spinneret) ================= */
const sec=new THREE.Scene();sec.background=new THREE.Color(0x1b2633);sec.add(new THREE.HemisphereLight(0xdff0ff,0x556677,1.6));AS.sun(sec,[-8,16,18],10,2.2);
const cutM=Ms({color:0xcfd3d6,roughness:.35,metalness:.6,side:THREE.DoubleSide});
// (a) mesin cacah: rumah setengah (belakang), dua rotor berpisau
const granS=new THREE.Group();sec.add(granS);mk(box(2.6,2.4,.1),cutM,granS,[0,1.2,-1.3]);mk(box(.1,2.4,2.6),cutM,granS,[-1.3,1.2,0]);mk(box(.1,2.4,2.6),cutM,granS,[1.3,1.2,0]);
const rotors=[-.55,.55].map(x=>{const r=new THREE.Group();r.position.set(m(x),m(1.0),0);granS.add(r);mk(cyl(.32,.32,2.5,20),AS.MAT.steel,r,[0,0,0],[PI/2,0,0]);for(let i=0;i<6;i++){const k=mk(box(.08,.3,2.4),Ms({color:0x8d939a,metalness:.7,roughness:.3}),r,[0,0,0]);k.rotation.z=i*PI/3;k.position.set(Math.cos(i*PI/3+PI/2)*m(.4),Math.sin(i*PI/3+PI/2)*m(.4),0)}return r});
const fallB=[];for(let k=0;k<6;k++){const b=petBottle(granS,{cap:k});b.rotation.set(PI/2,0,hash(k)*6);fallB.push(b)}
const flakeG=new THREE.BoxGeometry(m(.03),m(.004),m(.022));const flakeM=Ms({color:0xd6ecf5,roughness:.15,transparent:true,opacity:.85});
const flakesOut=dots(granS,240,flakeG,flakeM);/*butiran: serpihan plastik PET (padat)*/
