function frustum(x0,z0,x1,z1,y0,y1){/* corong persegi terbuka 4 sisi miring (meter) */const P=[[-x0,y0,-z0],[x0,y0,-z0],[x0,y0,z0],[-x0,y0,z0],[-x1,y1,-z1],[x1,y1,-z1],[x1,y1,z1],[-x1,y1,z1]].map(q=>q.map(m));

 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.computeVertexNormals();return g}
// konveyor sabuk: P0/P1 = titik permukaan sabuk di ekor/kepala (meter, koordinat parent); kaki tegak ke lantai di jarak s sepanjang sabuk

 const dx=P1[0]-P0[0],dz=P1[2]-P0[2],Hh=Math.hypot(dx,dz),dy=P1[1]-P0[1],L=Math.hypot(Hh,dy),a=Math.atan2(dy,Hh);
 const g=new THREE.Group();g.position.set(...P0.map(m));g.rotation.y=Math.atan2(-dz,dx);parent.add(g);const bed=new THREE.Group();bed.rotation.z=a;g.add(bed);
 const FR=Ms({color:col,roughness:.5,metalness:.4});
 COL.solid(mk(box(L,.03,w),AS.MAT.rubber,bed,[L/2,-.015,0]),null,name);
 for(const sd of[-1,1])COL.solid(mk(box(L+.1,.22,.05),FR,bed,[L/2,-.13,sd*(w/2+.05)]),null,name);
 for(const x of[0,L])mk(cyl(.11,.11,w+.06,20),AS.MAT.steel,bed,[x,-.12,0],[PI/2,0,0]);
 for(let x=.7;x<L-.3;x+=1.2)mk(cyl(.045,.045,w-.02,12),AS.MAT.steel,bed,[x,-.2,0],[PI/2,0,0]);
 if(skirt)for(const sd of[-1,1])COL.solid(mk(box(L-.4,skirt,.02),Ms({color:0xd9dee3,roughness:.4,metalness:.5}),bed,[L/2+.2,skirt/2,sd*(w/2+.02)]),null,name);
 mk(box(.4,.3,.3,.03),Ms({color:0x4a6b8a,roughness:.45}),bed,[L-.1,-.2,-(w/2+.28)]);mk(box(.25,.3,.15),FR,bed,[L-.1,-.2,-(w/2+.1)]);/* motor penggerak di sisi belakang kepala */
 for(const sv of legs){const x=sv*Math.cos(a),top=sv*Math.sin(a)-.22/Math.cos(a),bot=gy-P0[1],h=top-bot;for(const sd of[-1,1])mk(box(.08,h,.08),FR,g,[x,(top+bot)/2,sd*(w/2+.05)]);
  mk(box(.06,.06,w+.1),FR,g,[x,bot+h*.45,0]);for(const sd of[-1,1])mk(box(.24,.02,.24),FR,g,[x,bot+.01,sd*(w/2+.05)])}
 const cl=[];if(cleat){const n=Math.floor(L/cleat);for(let i=0;i<n;i++)cl.push(mk(box(.025,.07,w-.04),AS.MAT.rubber,bed,[0,.035,0]))}
 const u=V(Math.cos(a)*dx/Hh,Math.sin(a),Math.cos(a)*dz/Hh),n=V(-Math.sin(a)*dx/Hh,Math.cos(a),-Math.sin(a)*dz/Hh),lt=V(-dz/Hh,0,dx/Hh),p0=V(...P0);
 return {g,bed,L,a,u,n,lt,at:(sv,lat)=>p0.clone().addScaledVector(u,sv).addScaledVector(lt,lat),

// botol berbaring di sabuk: sumbu melintang sabuk (jit = sudut serong), sisi gepeng ke bawah
function placeOn(b,cv,sv,lat,jit,roll=0){const p=cv.at(sv,lat),ax=cv.lt.clone().multiplyScalar(Math.cos(jit)).addScaledVector(cv.u,Math.sin(jit)).normalize(),X=cv.n.clone(),Z=X.clone().cross(ax).normalize();

function tshirt(col=0x2f8a52){/* kain = bidang rapat 48x48 + siluet alphaMap: lipatan halus, bukan faset kardus */const P=[[-.13,0],[-.23,-.03],[-.36,-.13],[-.3,-.24],[-.25,-.2],[-.25,-.7],[.25,-.7],[.25,-.2],[.3,-.24],[.36,-.13],[.23,-.03],[.13,0],[.1,-.045],[.05,-.065],[0,-.07],[-.05,-.065],[-.1,-.045]];
