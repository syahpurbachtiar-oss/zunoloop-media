// dots = HANYA butiran (mikroba, gelembung gas, molekul gas, lalat) — BUKAN air

 return {im,set(fn){for(let k=0;k<n;k++){const p=fn(k);o.position.copy(p);const s_=p.s===undefined?1:p.s;o.scale.setScalar(Math.max(1e-4,s_));o.updateMatrix();im.setMatrixAt(k,o.matrix);if(p.c)im.setColorAt(k,p.c)}im.instanceMatrix.needsUpdate=true;if(im.instanceColor)im.instanceColor.needsUpdate=true}}}
const puffT=ctex(64,64,(c,w,h)=>{const g=c.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.45,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,w,h)});
function puffs(sc,n,size,col=0xffffff,op=.8){const g=new THREE.BufferGeometry();const pos=new Float32Array(n*3);g.setAttribute('position',new THREE.BufferAttribute(pos,3));
 const mt=new THREE.PointsMaterial({size:m(size),map:puffT,transparent:true,opacity:op,depthWrite:false,sizeAttenuation:true,color:col});const pt=new THREE.Points(g,mt);pt.frustumCulled=false;sc.add(pt);

function heap(sc,cx,cz,rad,ht,n,cols,sz=.16){const im=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(m(sz),0),Ms({color:0xffffff,roughness:.95}),n);im.castShadow=im.receiveShadow=true;sc.add(im);
 const o=new THREE.Object3D(),c=new THREE.Color();for(let k=0;k<n;k++){const a=hash(k)*PI*2,r=Math.sqrt(hash(k+3))*rad,y=Math.max(0,(1-r/rad))*ht*(.55+hash(k+7)*.45);
  o.position.set(m(cx+Math.cos(a)*r),m(y*.92),m(cz+Math.sin(a)*r));o.rotation.set(k,k*2.3,k*.7);const s=.8+hash(k+9)*.7;o.scale.set(s,s*.7,s*1.1);o.updateMatrix();im.setMatrixAt(k,o.matrix);c.setHex(cols[k%cols.length]);im.setColorAt(k,c)}

const mixTop=DG.userData.inlet.children[1];const mixMat=mixTop.material;const MIX0=new THREE.Color(0x3d2b1c),MIX1=new THREE.Color(0x6e5638);

heap(farm,5.6,4.2,1.3,.7,120,[0x5b4630,0x6f583c,0x4c3a28,0x7d6648],.13);

for(let k=0;k<26;k++)mk(new THREE.IcosahedronGeometry(m(.06+hash(k)*.04),0),Ms({color:DUNG[k%4],roughness:.95}),wb,[(hash(k+1)-.5)*.4,.68+hash(k+2)*.07,(hash(k+3)-.5)*.62],[k,k*2,k*3]);
const stir=stick(farm,.018,1.6,Ms({color:0x8a6a44,roughness:.8}));

const crust=mk(new THREE.CylinderGeometry(m(1.86),m(1.86),m(.22),40,1,false,PI/2,PI),Ms({color:0x2c2117,roughness:1}),sec,[0,SLT-.02,0]);
mk(new THREE.PlaneGeometry(m(3.72),m(.22)),Ms({color:0x231a12,roughness:1,side:THREE.DoubleSide}),crust,[0,0,.005]);

const paddle=new THREE.Group();paddle.position.set(0,m(.3),m(-.6));sec.add(paddle);mk(cyl(.03,.03,2.6,8),AS.MAT.steel,paddle,[0,0,0]);mk(box(1.2,.06,.3),AS.MAT.steel,paddle,[0,-.9,0]);

/* ================= SET 3: RUMAH WARGA ±2 km (dapur teras) ================= */
const home=outdoor('#86bdf0','#d6e8f4',60,300);AS.sun(home,[-20,30,25],18);AS.ground(home,600,'grass');
AS.house(home,{x:0,z:-4,w:7,d:7,h:3.2,wall:'#efe3c8',roof:0x9a4a32}).userData.wallMat.map=villageTex('#efe3c8');
AS.paving(home,0,1.6,6.4,4.2,'#bdb7aa');
for(const x of[-3,3])mk(box(.1,2.55,.1),Ms({color:0x6b4f3a,roughness:.9}),home,[x,1.3,3.55]);
{const r=mk(box(6.6,.04,4.5),Ms({color:0xb8bfc5,roughness:.45,metalness:.55}),home,[0,2.7,1.5]);r.rotation.x=.09}
const tableG=new THREE.Group();tableG.position.set(m(1.5),0,m(1.2));home.add(tableG);
mk(box(1.4,.06,.7),Ms({color:0x8a6a44,roughness:.8}),tableG,[0,.8,0]);for(const x of[-.62,.62])for(const z of[-.28,.28])mk(box(.06,.77,.06),Ms({color:0x6b4f3a}),tableG,[x,.4,z]);
const stv=AS.stove(tableG,{x:0,y:.83,z:0});
const wok=mk(new THREE.SphereGeometry(m(.17),24,10,0,PI*2,PI*.62,PI*.38),Ms({color:0x2a2a2c,roughness:.4,metalness:.6,side:THREE.DoubleSide}),tableG,[0,1.16,0]);
const oil=mk(new THREE.CircleGeometry(m(.09),20).rotateX(-PI/2),Ms({color:0xe0a43a,roughness:.2}),tableG,[0,1.026,0]);

for(const z of[-4.6,-1.8])mk(cyl(.04,.04,1,8),Ms({color:0xc9b47a,roughness:.9}),home,[5.2,.5,z]);mk(cyl(.03,.03,3,8),Ms({color:0xc9b47a,roughness:.9}),home,[5.2,.95,-3.2],[PI/2,0,0]);
AS.pipe(home,[[5.2,.12,-14],[5.2,.12,-4.8],[5.2,1.05,-4.6]],.03,PVC);

mk(cyl(.09,.09,.5,20),Ms({color:0xe8eef2,roughness:.1,transparent:true,opacity:.35,depthWrite:false}),filt,[0,.6,0]);mk(cyl(.08,.08,.36,18),Ms({color:0xb5562a,roughness:.95}),filt,[0,.58,0]);

AS.pipe(home,[[4.2,.88,.6],[4.2,.95,.6],[3.3,.72,.8],[2.4,.9,1.0],[2.15,.865,1.1],[1.72,.865,1.15]],.022,PVC,false);
const steam=puffs(home,14,.25,0xffffff,.5);const SKY_N=home.background,SKY_D=sky('#3b4f86','#e3a77a');
AS.tree(home,-7,-8,1.2);AS.tree(home,8,-10,1.1);AS.tree(home,-8,6,1);

/* ================= SAMPUL: kotoran sapi → kubah → api ================= */
const cov=new THREE.Scene();cov.add(new THREE.HemisphereLight(0xffffff,0xbfc6cc,1.7));{const l=new THREE.DirectionalLight(0xffffff,2.3);l.position.set(m(-6),m(10),m(10));cov.add(l)}
AS.cow(cov,{x:-2.6,z:.6,ry:.5,coat:0xb07a4a});const cd=AS.digester(cov,{x:1.4,z:-.6});AS.pipe(cov,[[1.4,1.62,-.6],[1.4,1.8,-.6],[3.6,1.8,-.6],[3.6,1.0,.4]],.05,PVC,false);

const SETS={farm,sec,home};

 fx:(u)=>{FX.emote('!',headW(),u-.4);FX.boom('KOTORAN SAPI?!',{x:540,y:560},u-.25,'#ff3b3b',1.6,100)}});
S(0,.55,{set:'home',a:1,cook:1,lamp:1,cam:(u)=>{aStove();A.act('present',u,'happy');A.gaze=gw(lampH,0,-.1,0);return[Cm(-1.9+u*.2,1.2,5.8),Cm(.3,1.45,1.4),44]},
