<script type="module">
import * as THREE from 'three';

const L=D.lines,N=L.length;
if(!D.starts){let t=.25;D.starts=[];D.durs=[];L.forEach(s=>{const d=.42*s.split(/\s+/).length+.3;D.starts.push(t);D.durs.push(d);t+=d+.06});D.total=t+.45}
const ST=D.starts,DUR=D.durs,TOTAL=D.total;
const PI=Math.PI,cl=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,p)=>a+(b-a)*p,e3=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,eo=x=>1-Math.pow(1-x,3);
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const hash=q=>{const x=Math.sin(q*127.1)*43758.5453;return x-Math.floor(x)};

/* ================= renderer ================= */
const W=1080,H=1920,canvas=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true});
R.setPixelRatio(1);R.setSize(W,H,false);R.setClearColor(0,0);R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.08;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const cam=new THREE.PerspectiveCamera(40,W/H,.1,1e5);
const C=makeCast(THREE,RBG,cam);const A=C.ayah;const U=C.M;const m=v=>v*U;
cam.near=m(.05);cam.far=m(3000);cam.updateProjectionMatrix();
const FX=makeFX(THREE,document.getElementById('st'),cam,canvas);
const LQ=makeLiquid(THREE);
const Cm=(x,y,z)=>V(m(x),m(y),m(z));const P=(x,y,z)=>[m(x),m(y),m(z)];

/* ================= helper ================= */
const ctex=(w,h,draw,rep=[1,1],srgb=true)=>{const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);
 if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...rep);t.anisotropy=4;return t};
const noiseTex=(base,vr,n=6000,sz=3,rep=[1,1])=>ctex(256,256,(x,w,h)=>{x.fillStyle=base;x.fillRect(0,0,w,h);for(let i=0;i<n;i++){x.fillStyle=vr[Math.floor(rnd()*vr.length)];x.fillRect(rnd()*w,rnd()*h,1+rnd()*sz,1+rnd()*sz)}},rep);
const Ms=o=>new THREE.MeshStandardMaterial(o);
const PO={polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-4};
const mk=(g,mat,p,pos,rot,sc)=>{const o=new THREE.Mesh(g,mat);o.castShadow=o.receiveShadow=true;if(pos)o.position.set(...pos);if(rot)o.rotation.set(...rot);if(sc)o.scale.set(...sc);if(p)p.add(o);return o};
const box=(w,h,d,r=0)=>r?new RBG(m(w),m(h),m(d),3,m(r)):new THREE.BoxGeometry(m(w),m(h),m(d));
const cyl=(rt,rb,h,s=28,open=false,a0=0,al=PI*2)=>new THREE.CylinderGeometry(m(rt),m(rb),m(h),s,1,open,a0,al);
const pl=(w,h)=>new THREE.PlaneGeometry(m(w),m(h));
const MAT={

 concrete:Ms({color:0xffffff,roughness:.95,map:noiseTex('#c9c5bd',['#b9b5ad','#d6d2ca','#a9a59e'],7000,3,[6,6])}),
 conDark:Ms({color:0xffffff,roughness:.95,map:noiseTex('#8d8a84',['#7d7a74','#9b988f','#6f6c66'],7000,3,[6,6])}),

 steel:Ms({color:0xcfd6dd,roughness:.35,metalness:.6}),dark:Ms({color:0x2a2f36,roughness:.5,metalness:.4}),rubber:Ms({color:0x1b1d20,roughness:.85}),
 alu:Ms({color:0xb9bec2,roughness:.4,metalness:.5}),
 glass:Ms({color:0xcfe9f5,roughness:.05,transparent:true,opacity:.28,depthWrite:false}),

 orange:Ms({color:0xf28c28,roughness:.5,metalness:.3}),yellow:Ms({color:0xf2c230,roughness:.5,metalness:.2}),
 green:Ms({color:0x2f8a52,roughness:.5,metalness:.2}),blueM:Ms({color:0x2f6bd6,roughness:.45,metalness:.3}),

};
function sky(top,bot){const hx=n=>typeof n==='number'?'#'+n.toString(16).padStart(6,'0'):n;top=hx(top);bot=hx(bot);return ctex(4,256,(c,w,h)=>{const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,top);g.addColorStop(.62,bot);g.addColorStop(1,bot);c.fillStyle=g;c.fillRect(0,0,w,h)})}
function outdoor(top,bot,fn,ff,sunPos,sh){const s=new THREE.Scene();s.background=sky(top,bot);s.fog=new THREE.Fog(new THREE.Color(bot),m(fn),m(ff));
 s.add(new THREE.HemisphereLight(0xdff0ff,0x7f8a66,1.35));const sun=new THREE.DirectionalLight(0xfff1dc,2.7);sun.position.set(...sunPos.map(m));sun.castShadow=true;
 sun.shadow.mapSize.set(2048,2048);const hs=m(sh);Object.assign(sun.shadow.camera,{left:-hs,right:hs,top:hs,bottom:-hs,near:m(1),far:m(700)});sun.shadow.bias=-.0003;sun.shadow.normalBias=.6;

 const l=new THREE.DirectionalLight(0xfff4e6,1.6);l.position.set(...sunPos.map(m));l.castShadow=true;l.shadow.mapSize.set(2048,2048);const h_=m(sh);Object.assign(l.shadow.camera,{left:-h_,right:h_,top:h_,bottom:-h_,near:m(1),far:m(400)});l.shadow.bias=-.0004;l.shadow.normalBias=.5;s.add(l);s.add(l.target);s.userData.sun=l;s.userData.fixedSun=1;
 return s}
const follow=(s,ctr)=>{const su=s.userData.sun;if(!su||s.userData.fixedSun)return;const o=su.position.clone().sub(su.target.position);su.target.position.copy(ctr);su.position.copy(ctr).add(o)};
// dots = HANYA untuk butiran (sampah, debu, abu, uap/asap, percikan) — BUKAN air
function dots(sc,n,r,col,mat){const im=new THREE.InstancedMesh(new THREE.DodecahedronGeometry(m(r),0),mat||new THREE.MeshBasicMaterial({color:col}),n);im.frustumCulled=false;sc.add(im);const o=new THREE.Object3D();
 return {im,set(fn){for(let k=0;k<n;k++){const p=fn(k);o.position.copy(p);const s_=p.s===undefined?1:p.s;o.scale.set(s_*(.75+hash(k)*.5),s_*(.6+hash(k+1)*.4),s_*(.75+hash(k+2)*.5));o.rotation.set(k*1.3,k*2.1,k*.7);o.updateMatrix();im.setMatrixAt(k,o.matrix)}im.instanceMatrix.needsUpdate=true}}}
// kepulan asap/uap/debu halus = sprite lembut (bukan bola)
const puffT=ctex(64,64,(c,w,h)=>{const g=c.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.45,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,w,h)});
function puffs(sc,n,size,col=0xffffff,op=.8){const g=new THREE.BufferGeometry();const pos=new Float32Array(n*3),cols=new Float32Array(n*3).fill(1);g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(cols,3));
 const mt=new THREE.PointsMaterial({size:m(size),map:puffT,transparent:true,opacity:op,depthWrite:false,vertexColors:true,sizeAttenuation:true,color:col});const pt=new THREE.Points(g,mt);pt.frustumCulled=false;sc.add(pt);

// sampah campur (butiran/kantong) — warna-warni kusam
const trashCols=[0x2e2f31,0x3a3a3a,0x5b5348,0x7a6a55,0x8d8f8a,0xa89f8a,0x405060,0x6b705c,0x9c6644,0xd9d4c7,0x2f4f3f,0x7f3f35,0x24262a,0xb9a77f];
function trashIM(sc,n,sz){const g=new THREE.IcosahedronGeometry(m(sz),1);const mt=Ms({color:0xffffff,roughness:.85});const im=new THREE.InstancedMesh(g,mt,n);im.castShadow=true;im.receiveShadow=true;im.frustumCulled=false;
 const c=new THREE.Color();for(let k=0;k<n;k++){c.setHex(trashCols[k%trashCols.length]);im.setColorAt(k,c)}sc.add(im);const o=new THREE.Object3D();
 return {im,set(fn){for(let k=0;k<n;k++){const p=fn(k);o.position.copy(p);o.scale.set((p.s??1)*(.8+hash(k)*.5),(p.s??1)*(.55+hash(k+1)*.35),(p.s??1)*(.8+hash(k+2)*.5));o.rotation.set(k*1.7,k*2.3,k*.9);o.updateMatrix();im.setMatrixAt(k,o.matrix)}im.instanceMatrix.needsUpdate=true}}}

function truck(){const g=new THREE.Group();
 mk(box(2.5,.5,9),MAT.dark,g,P(0,.9,0));

 const body=new THREE.Group();body.position.set(0,m(1.15),m(-4.4));g.add(body);g.userData.body=body;// poros jungkit di belakang-bawah
 mk(box(2.5,2.8,6.6,.2),Ms({color:0x2f8a52,roughness:.45,metalness:.2}),body,P(0,1.4,3.3));
 mk(box(2.52,.25,6.62),Ms({color:0xf2f4f5,roughness:.4}),body,P(0,2.3,3.3));
 for(const [z,d] of[[3.4,1],[-1.9,1],[-3.4,1]])for(const x of[-1.15,1.15])mk(cyl(.5,.5,.4,20).rotateZ(PI/2),MAT.rubber,g,P(x,.5,z));

const BZ0=-120,BZ1=60,BH0=85,BH1=12,BW=100,ROOFA=Math.atan2(BH0-BH1,BZ1-BZ0),ROOFL=Math.hypot(BZ1-BZ0,BH0-BH1);

const facTex=()=>ctex(256,256,(c,w,h)=>{c.fillStyle='#5b6873';c.fillRect(0,0,w,h);for(let r=0;r<8;r++){const y=r*32+5,off=(r%2)*40;for(let k=-1;k<4;k++){c.fillStyle=['#c3c8cc','#cdd2d6','#bcc1c5'][(r+k+3)%3];c.fillRect(off+k*80+2,y,76,24)}}c.fillStyle='rgba(255,255,255,.06)';c.fillRect(0,0,w,3)});
const slopeTex=()=>ctex(512,1024,(c,w,h)=>{c.fillStyle='#3d8b46';c.fillRect(0,0,w,h);for(let i=0;i<9000;i++){c.fillStyle=['#36803f','#46974f','#3a8743'][i%3];c.fillRect(rnd()*w,rnd()*h,2,4)}
 c.fillStyle='#8f8a80';c.fillRect(0,0,52,h);c.fillRect(w-52,0,52,h);for(let y=0;y<h;y+=46){c.fillStyle='#4e7a3a';c.beginPath();c.arc(26,y+20,18,0,7);c.fill();c.beginPath();c.arc(w-26,y+30,18,0,7);c.fill()}
 c.strokeStyle='#6fc069';c.lineWidth=70;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(150,20);for(let k=0;k<6;k++){c.lineTo(k%2?150:360,80+k*175)}c.lineTo(256,h-30);c.stroke();
 c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=3;c.setLineDash([14,12]);c.stroke()});
function buildPlant(par,mini=false){const g=new THREE.Group();par.add(g);
 const fac=facTex();fac.repeat.set(1/m(10),1/m(10));const facS=Ms({map:fac,roughness:.55,metalness:.25,side:THREE.DoubleSide});
 const prof=new THREE.Shape([new THREE.Vector2(m(BZ0),0),new THREE.Vector2(m(BZ1),0),new THREE.Vector2(m(BZ1),m(BH1)),new THREE.Vector2(m(BZ0),m(BH0))]);
 for(const x of[-BW/2,BW/2]){const sg=new THREE.ShapeGeometry(prof);sg.rotateY(-PI/2);mk(sg,facS,g,P(x,0,0))}
 const fb=facTex();fb.repeat.set(BW/10,BH0/10);mk(pl(BW,BH0).rotateY(PI),Ms({map:fb,roughness:.55,metalness:.25}),g,P(0,BH0/2,BZ0));
 const ff=facTex();ff.repeat.set(BW/10,BH1/10);mk(pl(BW,BH1),Ms({map:ff,roughness:.55,metalness:.25}),g,P(0,BH1/2,BZ1));
 // atap dasar (beton abu) + lapisan lintasan ski hijau (0,3 m di atasnya, bisa "digelar" dari puncak)
 const roof=mk(pl(BW,ROOFL).rotateX(-PI/2),Ms({color:0xffffff,roughness:.95,map:noiseTex('#9a978f',['#8c8981','#a7a49c'],6000,3,[10,20])}),g,P(0,(BH0+BH1)/2,(BZ0+BZ1)/2));roof.rotation.x=ROOFA;
 const sg=pl(BW,ROOFL).rotateX(-PI/2);sg.translate(0,0,m(ROOFL/2));
 const slope=mk(sg,Ms({...PO,map:slopeTex(),roughness:.95}),g);slope.rotation.x=ROOFA;const nrm=V(0,Math.cos(ROOFA),Math.sin(ROOFA)).multiplyScalar(m(.3));

 // cerobong + lift + pohon tepi
 mk(cyl(3,3.4,42,24),Ms({color:0xd7dadc,roughness:.4,metalness:.4}),g,P(32,BH0-2+21,BZ0+10));mk(cyl(3.2,3.2,1.2,24),MAT.dark,g,P(32,BH0+40,BZ0+10));

 if(!mini){const lf=Ms({color:0x4e7a3a,roughness:.85});for(let z=BZ0+8;z<BZ1-4;z+=11)for(const x of[-46,46])mk(new THREE.IcosahedronGeometry(m(2.2+rnd()*.8),1),lf,g,P(x+(rnd()-.5)*2,roofY(z)+2.4,z));
  const poles=[];for(let z=BZ1-8;z>BZ0+4;z-=26){const y0=roofY(z)+.3;mk(cyl(.25,.3,8,10),MAT.steel,g,P(-36,y0+4,z));mk(box(2.4,.3,.3),MAT.steel,g,P(-36,y0+8,z));poles.push(V(m(-36),m(y0+8.2),m(z)))}
  tube(poles,.05,MAT.dark,g,80);g.userData.lift=poles}
 return g}

{const s=city;

 {const n=900,im=new THREE.InstancedMesh(new THREE.DodecahedronGeometry(m(.16),0),Ms({color:0xffffff,roughness:.6}),n),o=new THREE.Object3D(),c=new THREE.Color();

 for(let i=0;i<24;i++){const x=150+i*9,col=hcols[i%hcols.length];const mt=Ms({map:hTex(col),roughness:.8,emissive:0xffb060,emissiveIntensity:0});ct.houseMats.push(mt);

 mk(pl(230,5).rotateX(-PI/2),Ms({...PO,color:0xffffff,roughness:.9,map:noiseTex('#bdb8ae',['#b0aba1','#c9c4ba'],5000,2,[40,1])}),s,P(255,.06,212.6));
