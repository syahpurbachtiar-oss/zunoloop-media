<script type="module">
import * as THREE from 'three';

const D=await (await fetch("data.json?"+Date.now())).json();

const PI=Math.PI,cl=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,p)=>a+(b-a)*p,e3=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,eo=x=>1-Math.pow(1-x,3);
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const hash=q=>{const x=Math.sin(q*127.1)*43758.5453;return x-Math.floor(x)};

/* ================= renderer ================= */
const W=1080,H=1920,canvas=document.getElementById('c');

/* ================= helper ================= */

 const segs=[],N=12;for(let i=0;i<N;i++){const r0=.21-i*.012;const s=mk(cyl(r0-.006,r0,1,14),SKIN,g);const j=mk(new THREE.SphereGeometry(m(r0),14,10),SKIN,g);segs.push([s,j])}

 g.userData.trunk(0,null,0);return g}

{const WD=Ms({color:0x7a5a3a,roughness:.85});COL.solid(mk(box(1.6,.04,.6),WD,trough,[0,.52,0]),null,'palung');for(const sd of[-1,1]){COL.solid(mk(box(1.6,.22,.04),WD,trough,[0,.65,sd*.28]),null,'palung');COL.solid(mk(box(.04,.22,.6),WD,trough,[sd*.78,.65,0]),null,'palung')}
 for(const x of[-.7,.7])for(const z of[-.24,.24])mk(box(.06,.5,.06),WD,trough,[x,.25,z]);mk(new THREE.PlaneGeometry(m(1.5),m(.5)).rotateX(-PI/2),Ms({color:0xefe8d8,roughness:.8}),trough,[0,.56,0])}

for(let i=0;i<6;i++){const b=mk(new THREE.CapsuleGeometry(m(.018),m(.13),4,8),Ms({color:0xe8c840,roughness:.6}),trough,[-.6+i*.24,.587,(hash(i+30)-.5)*.3]);b.rotation.order='YXZ';b.rotation.set(0,(hash(i+31)-.5)*.6,PI/2);COL.item(b,[0,-m(.065),0],[0,m(.065),0],m(.018),'pisang',true)}
// gajah: dua di palung, satu di padang

const eleB=elephant(camp);eleB.position.set(m(-6),0,m(-6));eleB.rotation.y=.9;
// kotoran gajah + biji kopi di permukaannya dan di rumput
const dung=new THREE.Group();dung.position.set(m(-2.6),0,m(1.8));camp.add(dung);
{for(let i=0;i<6;i++){const a=i*1.1,r=i?0.16:0;mk(new THREE.SphereGeometry(m(.1),16,10),DUNG,dung,[Math.cos(a)*r,.07+(i?0:.08),Math.sin(a)*r],[hash(i)*2,hash(i+1)*2,0],[1,.75,1])}}
const dungBeans=new THREE.InstancedMesh(beanGeo,BEANR,40);dung.add(dungBeans);{const o=new THREE.Object3D();for(let i=0;i<40;i++){const a=hash(i+50)*PI*2,r=.1+hash(i+51)*.45;o.position.set(m(Math.cos(a)*r),m(.004),m(Math.sin(a)*r));o.rotation.set(0,hash(i+52)*6,0);o.updateMatrix();dungBeans.setMatrixAt(i,o.matrix)}}

const bkB=new THREE.InstancedMesh(beanGeo,BEANR,30);basket.add(bkB);{const o=new THREE.Object3D();for(let i=0;i<30;i++){o.position.set(m((hash(i+70)-.5)*.16),m(.012+Math.floor(i/10)*.008),m((hash(i+71)-.5)*.16));o.rotation.set(0,hash(i+72)*6,0);o.updateMatrix();bkB.setMatrixAt(i,o.matrix)}}
// meja teras: secangkir Black Ivory

{const WD=Ms({color:0x5a3a24,roughness:.6});COL.solid(mk(cyl(.4,.4,.04,32),WD,table,[0,.74,0]),null,'meja');mk(cyl(.04,.06,.72,12),WD,table,[0,.36,0]);mk(cyl(.25,.25,.02,24),WD,table,[0,.01,0]);

{const WD=Ms({color:0x9a7a4a,roughness:.85}),NETM=Ms({color:0x2a2f36,roughness:.8});const o=new THREE.Object3D();let c=0;BEDS.forEach(([x,z],k)=>{for(const dx of[-.95,.95])for(const dz of[-.45,.45])mk(box(.05,.9,.05),WD,proc,[x+dx,.45,z+dz]);for(const sd of[-1,1]){mk(box(2,.05,.05),WD,proc,[x,.9,z+sd*.5]);mk(box(.05,.05,1),WD,proc,[x+sd*1,.9,z])}
