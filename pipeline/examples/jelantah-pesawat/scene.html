<script type="module">

/* ================= renderer ================= */

{const tm=new THREE.Group();tm.position.set(m(-45),0,m(-20));apron.add(tm);mk(box(18,10,120),Ms({color:0xe8e9e6,roughness:.6}),tm,[0,5,0]);mk(box(.3,7,118),Ms({color:0x6f8fa8,roughness:.1,metalness:.4}),tm,[9.1,5.2,0]);mk(box(20,.8,122),Ms({color:0xb9bfc6,roughness:.4,metalness:.4}),tm,[0,10.4,0])}

mk(box(1.8,.05,.7),Ms({color:0x8a6a44}),bank,[0,.75,2.6]);for(const x of[-.8,.8])for(const z of[2.3,2.9])mk(box(.05,.73,.05),Ms({color:0x6b4f3a}),bank,[x,.37,z]);

/* ================= SET 4: SPBU + kotak setor jelantah ================= */
const spbu=outdoor('#86bdf0','#d6e8f4',80,400);AS.sun(spbu,[-30,40,30],30);AS.ground(spbu,800,'grass');

{const cg=new THREE.Group();spbu.add(cg);for(const x of[-7,7])for(const z of[-4,4])mk(box(.5,5.4,.5),Ms({color:0xf2f4f5,roughness:.4}),cg,[x,2.7,z]);

 for(let y=6;y<h;y+=6){mk(new THREE.TorusGeometry(m(r+.6),m(.05),4,32),AS.MAT.steel,g,[0,y,0],[PI/2,0,0]);mk(cyl(r+.6,r+.6,.08,32,true),Ms({color:0x8d939a,metalness:.5,roughness:.5,side:THREE.DoubleSide}),g,[0,y-.05,0])}
