<script type="module">
import * as THREE from 'three';

/* ================= timing / script ================= */
const D=await (await fetch("data.json?"+Date.now())).json();
const L=D.lines,ST=D.starts,DUR=D.durs,TOTAL=D.total,CHIP=D.chips;
const N=L.length,SEND=ST.map((s,i)=>i<N-1?ST[i+1]:TOTAL);

const sp=(i,t)=>cl((t-ST[i])/(SEND[i]-ST[i]),0,1); // progress within scene i
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-120,right:120,top:170,bottom:-40,near:40,far:600});
key.shadow.bias=-.0004;key.shadow.normalBias=.4;key.shadow.radius=4;scene.add(key);

/* floor */
{const g=new THREE.CircleGeometry(500,96);g.rotateX(-Math.PI/2);

 const gr=x.createRadialGradient(256,256,0,256,256,256);gr.addColorStop(0,'rgba(120,180,255,.55)');gr.addColorStop(.3,'rgba(60,120,210,.22)');gr.addColorStop(1,'rgba(20,50,100,0)');

/* ================= materials ================= */
const M=(o)=>new THREE.MeshStandardMaterial(o);
const mk=(geo,mat,parent,pos,rot)=>{const m=new THREE.Mesh(geo,mat);m.castShadow=m.receiveShadow=true;
 if(pos)m.position.set(...pos);if(rot)m.rotation.set(...rot);parent.add(m);return m};
const steel=()=>M({color:0xd5dde6,roughness:.24,metalness:.92});

const plastic=(c)=>M({color:c,roughness:.45,metalness:0});
const panel=()=>M({color:0xeef2f6,roughness:.42,metalness:.05});

function textTex(lines,{w=512,h=128,bg='#0b2340',fg='#ffffff',font=64}={}){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');
 x.fillStyle=bg;x.fillRect(0,0,w,h);x.fillStyle=fg;x.font=`800 ${font}px "Segoe UI",Arial,sans-serif`;x.textAlign='center';x.textBaseline='middle';
 const ls=[].concat(lines);ls.forEach((s,k)=>x.fillText(s,w/2,h/2+(k-(ls.length-1)/2)*font*1.1));const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}

function lump(r,sq=.72,amp=.18){const g=new THREE.SphereGeometry(r,36,24),p=g.attributes.position,v=new THREE.Vector3();

 PARTS.push({g,p,s,e:e??99,off:V(...(off||[0,45,0])),piv:V(...pivot),hl:[]});return g}
const P=n=>PARTS.find(x=>x.g.name===n);

 const arr=[];for(let k=0;k<n;k++){const s=new THREE.Mesh(new THREE.SphereGeometry(size,10,8),mat);s.visible=false;parent.add(s);arr.push(s)}
 FLOWS.push({curve,arr,on,speed});}

 const h=mk(new THREE.TorusGeometry(4.6,1,12,32,Math.PI),glass(0xe9f3ff,.5),jug,[-27,11,FZ],[0,0,Math.PI/2]);h.castShadow=false;

/* drinking pouch (clean water) */

 mk(new THREE.CylinderGeometry(1.4,1.4,2.4,24),plastic(0x2d8cf0),g,[0,8.6,0]);
 mk(new THREE.CylinderGeometry(.5,.5,7,12),plastic(0xffffff),g,[0,12.5,0]);
 label('AIR MINUM',8,2.2,g,[0,4.6,1.65],[0,0,0],{w:384,h:96,bg:'#ffffff',fg:'#1f6fd0',font:52});return g}
const pouch0=part('pouch0',0,1,[0,0,0],[14,14,FZ]);
const pouch0m=pouchMesh(pouch0,[14,14,FZ+2]);
/* floating droplets (microgravity) */
const floaters=part('float',0,1,[0,0,0],[0,14,FZ]);const FL=[];
for(let k=0;k<14;k++){const y=k%2===0,s=new THREE.Mesh(new THREE.SphereGeometry(.7+rnd()*1.1,16,12),liquid(y?URINE:WATER,.85));s.castShadow=true;floaters.add(s);
 FL.push({s,x:(rnd()*2-1)*26,y:32+rnd()*14,z:FZ+(rnd()*2-1)*14,p:rnd()*6})}
/* cloth filter: beaker + funnel + cloth */
const cloth=part('cloth',1,2,[0,40,0],[2,10,FZ]);
let beakLiq,clothDrops=[];
{const bx=2;mk(new THREE.CylinderGeometry(6.5,6.2,15,48,1,true),glass(),cloth,[bx,7.5,FZ]).castShadow=false;
 mk(new THREE.CircleGeometry(6.2,40),glass(0xe9f3ff,.4),cloth,[bx,.05,FZ],[-Math.PI/2,0,0]);

 for(let k=1;k<5;k++)mk(new THREE.BoxGeometry(1.6,.18,.1),M({color:0xffffff}),cloth,[bx+3.6,k*3,FZ+6.4]);
 const clothY=r=>r>9?26.35+(r-9)*-.4:Math.max(20.7,17+(r-1.2)*9/7.8-.35);
 const fun=mk(new THREE.CylinderGeometry(9,1.2,9,48,1,true),glass(0xe9f3ff,.35),cloth,[bx,21.5,FZ]);fun.castShadow=false;
 mk(new THREE.CylinderGeometry(1.1,1.1,4,16,1,true),glass(0xe9f3ff,.4),cloth,[bx,15.5,FZ]);
 // cloth: sagging disc (canvas texture)
 const cv=document.createElement('canvas');cv.width=cv.height=256;const x=cv.getContext('2d');x.fillStyle='#efe6d2';x.fillRect(0,0,256,256);
 x.strokeStyle='#d6c9ad';x.lineWidth=2;for(let i=0;i<256;i+=6){x.beginPath();x.moveTo(i,0);x.lineTo(i,256);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(256,i);x.stroke()}
 x.fillStyle='rgba(205,160,40,.55)';x.beginPath();x.arc(128,128,80,0,7);x.fill();
 const tx=new THREE.CanvasTexture(cv);tx.colorSpace=THREE.SRGBColorSpace;
 const cg=new THREE.CircleGeometry(10.2,64,0,Math.PI*2);cg.rotateX(-Math.PI/2);const pp=cg.attributes.position;
 for(let i=0;i<pp.count;i++){const r=Math.hypot(pp.getX(i),pp.getZ(i));pp.setY(i,clothY(r)-26+Math.sin(Math.atan2(pp.getZ(i),pp.getX(i))*7)*.12*(r/10.2))}cg.computeVertexNormals();
 mk(cg,M({map:tx,roughness:.95,side:THREE.DoubleSide}),cloth,[bx,26,FZ]);
 for(let k=0;k<9;k++){const a=rnd()*6.28,r=rnd()*5;mk(lump(.9,.6),M({color:0x7a5a2e,roughness:.9}),cloth,[bx+Math.cos(a)*r,clothY(r)+.55,FZ+Math.sin(a)*r])}
 const dm=liquid(URINE,.9);for(let k=0;k<4;k++){const d=new THREE.Mesh(new THREE.SphereGeometry(.6,10,8),dm);d.scale.set(1,1.5,1);cloth.add(d);clothDrops.push({d,p:k/4})}}
/* boiling: hotplate + flask + condenser tube + collecting glass */
const still=part('still',2,3,[0,40,0],[6,10,FZ]);
let steamP=[],stillDrops=[],coilMat,collLiq;
{mk(new RoundedBoxGeometry(20,4,20,3,1),darkMetal(),still,[-4,2,FZ]);

 mk(new RoundedBoxGeometry(3,1.6,1,2,.4),plastic(0xff4d4f),still,[-4,2,FZ+10.2]);
 const fl=mk(new THREE.SphereGeometry(7,48,32),glass(0xe9f3ff,.28),still,[-4,11.3,FZ]);fl.castShadow=false;
 const lq=new THREE.SphereGeometry(6.6,40,24,0,Math.PI*2,Math.PI*.55,Math.PI*.45);mk(lq,liquid(URINE,.85),still,[-4,11.3,FZ]);
 mk(new THREE.CylinderGeometry(1.8,1.8,8,24,1,true),glass(0xe9f3ff,.35),still,[-4,21,FZ]).castShadow=false;
 const tube=pipe([[-4,24.5,FZ],[-3,28,FZ],[6,27,FZ],[15,20,FZ],[19,14,FZ]],1,glass(0xe9f3ff,.4),still);tube.castShadow=false;
 mk(new THREE.CylinderGeometry(4.6,4.4,11,40,1,true),glass(),still,[19,5.5,FZ]).castShadow=false;
 mk(new THREE.CircleGeometry(4.4,32),glass(0xe9f3ff,.4),still,[19,.05,FZ],[-Math.PI/2,0,0]);

 for(let k=0;k<14;k++){const s=new THREE.Mesh(new THREE.SphereGeometry(.6+rnd()*.6,10,8),sm);still.add(s);steamP.push({s,p:rnd(),x:(rnd()*2-1)}) }
 const dm=liquid(WATER,.9);for(let k=0;k<3;k++){const d=new THREE.Mesh(new THREE.SphereGeometry(.55,10,8),dm);d.scale.set(1,1.4,1);still.add(d);stillDrops.push({d,p:k/3})}
 for(let k=0;k<8;k++){const b=new THREE.Mesh(new THREE.SphereGeometry(.35+rnd()*.3,8,6),M({color:0xfff2c4,transparent:true,opacity:.7}));still.add(b);steamP.push({s:b,p:rnd(),x:(rnd()*2-1),bub:1})}}

/* ================= RACKS ================= */
function rack(name,s,cx,shelves,title){const g=part(name,s,99,[0,0,0],[cx,0,0]);const a=alu();
 for(const x of[cx-25,cx+25])for(const z of[-20,20]){mk(new RoundedBoxGeometry(2.4,135,2.4,2,.4),a,g,[x,67.5,z]);
   for(let y=8;y<135;y+=12)mk(new THREE.BoxGeometry(.5,.9,.5),darkMetal(),g,[x+(x<cx?1.25:-1.25),y,z+(z>0?1.21:-1.21)])}
 for(const y of shelves){mk(new RoundedBoxGeometry(50,1.2,40,2,.4),M({color:0xc9d2dc,roughness:.45,metalness:.6}),g,[cx,y,0]);
   for(const z of[-19,19])mk(new RoundedBoxGeometry(52,2.2,1.6,2,.5),a,g,[cx,y,z]);
   for(const x of[cx-23,cx+23])bolt(g,[x,y+.8,18],[0,0,0])}

 return g}

{const hm=M({color:0xc7d0da,roughness:.3,metalness:.85,side:THREE.DoubleSide});
 const hs=new THREE.CylinderGeometry(13,13,30,72,1,true);hs.rotateX(Math.PI/2);mk(hs,hm,da,DA_C);
 mk(new THREE.CircleGeometry(13,64),M({color:0x9aa6b3,roughness:.4,metalness:.8,side:THREE.DoubleSide}),da,[DA_C[0],DA_C[1],-15]);
 for(const z of[15,-15,0])mk(new THREE.TorusGeometry(13.2,.7,12,80),steel(),da,[DA_C[0],DA_C[1],z]);

 // saddles

  const eg=new THREE.ExtrudeGeometry(sh,{depth:2.4,bevelEnabled:false,curveSegments:24});mk(eg,darkMetal(),da,[DA_C[0],46.6,z-1.2])}
 // rotating drum interior: wall with stripes + urine film
 const cv=document.createElement('canvas');cv.width=512;cv.height=64;const x=cv.getContext('2d');x.fillStyle='#d8e0e8';x.fillRect(0,0,512,64);
 x.fillStyle='#55606c';for(let i=0;i<16;i++)x.fillRect(i*32,0,6,64);const tx=new THREE.CanvasTexture(cv);tx.colorSpace=THREE.SRGBColorSpace;
 const dg=new THREE.CylinderGeometry(DR,DR,28,72,1,true);dg.rotateX(Math.PI/2);mk(dg,M({map:tx,roughness:.3,metalness:.8,side:THREE.BackSide}),drumRot);

 const fg=new THREE.CylinderGeometry(DR-.9,DR-.9,26,72,1,true);fg.rotateX(Math.PI/2);noShadow(mk(fg,filmMat,drumRot));
 for(const z of[-13.6,13.6])mk(new THREE.TorusGeometry(DR,.6,10,72),steel(),drumRot,[0,0,z]);
 for(let k=0;k<6;k++){const r=mk(new THREE.BoxGeometry(1.2,1.4,26),darkMetal(),drumRot,[0,0,0]);r.position.set(Math.cos(k*1.047)*(DR-.5),Math.sin(k*1.047)*(DR-.5),0);r.rotation.z=k*1.047}
 // central stationary feed tube

 for(let k=0;k<4;k++)mk(new THREE.TorusGeometry(9.1,.3,8,48),steel(),iod,[34,6+k*6.5,0],[Math.PI/2,0,0]);
 tankLiq=mk(new THREE.CylinderGeometry(8.5,8.5,1,44),liquid(WATER,.75),iod,[34,2.9,0]);
 label('AIR MINUM',10,2.2,iod,[34,24,9.15],[0,0,0],{w:448,h:96,bg:'#1f7bea',fg:'#fff',font:58});
 const sp_=pipe([[8,41.8,14.4],[8,42.4,19],[8,42.4,21.3],[8.5,36,23.5],[9,24,22],[12,19,12],[12,15.6,8.6]],.75,steel(),iod,100);
 flow(sp_.userData.curve,6,WATER,t=>t>ST[11]+(SEND[11]-ST[11])*.6,.3,.55);
 const tp=pipe([[15,6,8],[20,6,7],[25.4,7,3]],.75,steel(),iod);
 flow(tp.userData.curve,4,0xd9a25a,t=>t>ST[12]+.4,.5,.5);
 hl('iod',[ib]);}

/* ================= FINAL POUCH (K14-15) ================= */
const pouch=part('pouch',13,99,[0,30,0],[0,30,38]);
const pouchM=pouchMesh(pouch,[0,30,38],1.25);

/* ================= cameras ================= */
const SH=[
 {p:[66,56,195],t:[-3,16,45],m:'push',a:.2},
 {p:[6,150,108],t:[0,8,45],m:'crane',a:-18},
 {p:[-112,30,62],t:[6,14,45],m:'truck',a:14},
 {p:[-30,54,74],t:[-38,61,0],m:'push',a:.25},
 {p:[-6,98,48],t:[-14,82,8],m:'orbit',a:.35},
 {p:[-6,50,66],t:[-17,59,0],m:'truck',a:6},
 {p:[-4,124,72],t:[-32,106,0],m:'orbit',a:.25},
 {p:[-8,24,112],t:[-28,18,0],m:'push',a:.2},
 {p:[100,130,84],t:[28,113,0],m:'crane',a:10},
 {p:[-2,100,98],t:[24,85,0],m:'orbit',a:-.3},
 {p:[18,38,-72],t:[24,50,0],m:'truck',a:-12},
 {p:[46,60,68],t:[14,48,8],m:'push',a:.2},
 {p:[18,58,86],t:[22,16,4],m:'crane',a:-10},
 {p:[-120,96,330],t:[0,68,0],m:'orbit',a:.32},
 {p:[130,120,330],t:[0,64,0],m:'pullorbit',a:-.3}];
function camAt(i,t){const s=SH[i],u=e3(cl((t-ST[i])/Math.max(1.5,SEND[i]-ST[i]+1.2),0,1));
 const Pp=V(...s.p),Tt=V(...s.t);
 if(s.m==='push')Pp.lerp(Tt,s.a*u);
 else if(s.m==='crane'){Pp.y+=s.a*u;Tt.y+=s.a*.25*u}
 else if(s.m==='truck'){const side=V(0,1,0).cross(Tt.clone().sub(Pp)).normalize();Pp.addScaledVector(side,s.a*u);Tt.addScaledVector(side,s.a*.6*u)}
 else if(s.m==='orbit'||s.m==='pullorbit'){const d=Pp.clone().sub(Tt).applyAxisAngle(V(0,1,0),s.a*u);if(s.m==='pullorbit')d.multiplyScalar(1+.08*u);Pp.copy(Tt).add(d)}
 return [Pp,Tt]}

/* ================= overlay ================= */
const $=s=>document.querySelector(s);
function chunks(t){const w=t.split(/\s+/),o=[];let c=[];for(const x of w){const tt=[...c,x].join(' ');
 if(c.length&&(tt.length>16||c.length>=3)){o.push(c.join(' '));c=[x]}else c.push(x);if(/[,.?!:…]$/.test(x)&&c.length){o.push(c.join(' '));c=[]}}
 if(c.length)o.push(c.join(' '));return o}
const CH=L.map(chunks),CHT=CH.map((cs,i)=>{const tot=cs.reduce((a,b)=>a+b.length,0);let t=ST[i];return cs.map(c=>{const d=DUR[i]*c.length/tot,o=[t,t+d];t+=d;return o})});
const cap=$('#cap'),hb=$('#hb'),chip=$('#chip'),flash=$('#flash');

/* ================= drum angle integration ================= */
const DT=1/120,NA=Math.ceil(TOTAL/DT)+2,ANG=new Float64Array(NA);
function omega(t){const i=sceneIdx(t);if(i<3)return 0;if(i===3)return 1+22*e3(cl((t-ST[3])/2,0,1));return 9}
{let a=0;for(let k=0;k<NA;k++){ANG[k]=a;a+=omega(k*DT)*DT}}
const dAng=t=>ANG[cl(Math.round(t/DT),0,NA-1)];

/* ================= render(t) ================= */
function render(t){t=cl(t,0,TOTAL);const i=sceneIdx(t);
 for(const pr of PARTS){const a=ST[pr.s]+(pr.s===0?-1:.05);let sc=0,k=0;
  if(t>=a){const p=cl((t-a)/.8,0,1);k=eo(p);sc=Math.max(.001,bk(cl((t-a)/.65,0,1)))}
  if(pr.e<N&&t>=ST[pr.e]){const q=cl((t-ST[pr.e])/.45,0,1);sc*=1-e3(q);if(q>=1)sc=0}
  pr.p.visible=sc>.002;pr.p.scale.setScalar(Math.max(sc,.001));
  pr.p.position.copy(pr.piv).addScaledVector(pr.off,1-k);
  const hot=i===pr.s&&pr.s>=3&&pr.s<13;
  const glow=hot?(.5*Math.sin(cl((t-ST[i]-.7)/2.4,0,1)*Math.PI)*(.6+.4*Math.sin(t*9))):0;
  pr.hl.forEach(m=>{if(!m.emissive)return;m.emissive.set(0x3da2ff);m.emissiveIntensity=glow})}

 /* K1 floaters + pouch bob */
 FL.forEach((f,k)=>f.s.position.set(f.x+Math.sin(t*.7+f.p)*1.5,f.y+Math.sin(t*1.1+f.p*2)*2,f.z+Math.cos(t*.8+f.p)*1.5));
 pouch0m.position.y=14+Math.sin(t*1.3)*1.2;pouch0m.rotation.set(Math.sin(t*.9)*.12,-.35+Math.sin(t*.6)*.1,Math.sin(t*.7)*.08);
 /* K2 cloth drip */
 {const u=sp(1,t);beakLiq.scale.y=1+u*9;beakLiq.position.y=.5+u*4.5;
  clothDrops.forEach(d=>{const p=(t*1.3+d.p)%1;d.d.position.set(2,13.4-p*(12.5-u*9),FZ);d.d.visible=i>=1&&p*(12.5)<12.5-u*9+.1})}
 /* K3 still */
 {const u=sp(2,t);coilMat.emissiveIntensity=i>=2?1.6*cl((t-ST[2])/1,0,1):0;collLiq.scale.y=1+u*5;collLiq.position.y=.5+u*2.5;
  steamP.forEach(s=>{const p=(t*.5+s.p)%1;if(s.bub){s.s.position.set(-4+s.x*4,6+p*7.5,FZ+s.x*2);s.s.visible=i===2;return}
   const pt=p<.4?V(-4+s.x*2.5,13+p*28,FZ+s.x):V(-4+(p-.4)/.6*6,24.5+Math.sin((p-.4)/.6*Math.PI)*3,FZ);s.s.position.copy(pt);s.s.visible=i===2&&p<.75});
  stillDrops.forEach(d=>{const p=(t*1.1+d.p)%1;d.d.position.set(19,13-p*(12-u*5),FZ);d.d.visible=i===2})}
 /* DA spin + film + vapor */
 {const ang=dAng(t);drumRot.rotation.z=ang;filmMat.opacity=i>=3?.8*cl((t-ST[3]-.4)/1.2,0,1):0;
  vapor.forEach(v=>{const p=(t*.45+v.p)%1,r=(DR-1.5)*(1-p),a=v.a+ang*.3;v.s.position.set(DA_C[0]+Math.cos(a)*r,DA_C[1]+Math.sin(a)*r,v.z);v.s.visible=i>=3&&p>.05})}
 /* vacuum needle: 760 -> ~32 mmHg */
 {const u=i<4?0:e3(cl((t-ST[4]-.6)/2.6,0,1));const val=lerp(760,32,u);const a=Math.PI*.75+(760-val)/760*Math.PI*1.5;needle.rotation.z=-a-Math.PI/2;}
 /* compressor lobes + heat pipe */
 {const r=i>=5?(t-ST[5])*7:0;lobes[0].rotation.z=r;lobes[1].rotation.z=-r+Math.PI/2;
  heatPipe.material.emissiveIntensity=i>=5?(.5+.4*Math.sin(t*4))*cl((t-ST[5]-.6)/1,0,1)*(i===5?1:.4):0}
 /* pretreat: germs fade, liquid level */
 {const u=i<6?0:cl((t-ST[6]-1.8)/2.2,0,1);germs.forEach((g,k)=>{g.visible=i>=6&&u<1;g.scale.setScalar(Math.max(.01,1-u));g.position.y+=Math.sin(t*3+k)*.01;g.rotation.y=t*1.5+k})}
 /* BPA: bladder shrink, fan, air */
 {const u=i<7?0:cl((t-ST[7]-.8)/(SEND[7]-ST[7]),0,1);const sq=1-.55*e3(u);bladder.scale.set(1.35*(.55+.45*sq),sq,1.05*(.6+.4*sq));bladder.position.y=15.5-(1-sq)*6;
  fanB.rotation.x=i>=7?t*14:0;heatMat.emissiveIntensity=i>=7?1.4:0;
  airP.forEach(a=>{const p=(t*.6+a.p)%1;a.s.position.set(-15-p*30,a.y+Math.sin(p*9+a.p*6)*.6,a.z);a.s.visible=i>=7&&(i===7||i>=13)})}
 /* CHX */
 {fanC.rotation.x=i>=8?t*12:0;mist.forEach(m=>{const p=(t*.5+m.p)%1;m.s.position.set(8+p*38,m.y,m.z);m.s.material.opacity=.45*(1-p);m.s.visible=i>=8&&(i===8||i>=13)});
  cDrops.forEach(d=>{const p=(t*.4+d.p)%1;d.d.position.set(d.x,123-p*17.5,d.z);d.d.visible=i>=8})}
 /* filter dust */
 dust.forEach(d=>{const p=(t*.3+d.p)%1;d.s.position.set(14+Math.cos(d.a)*d.r,92-p*16,4+Math.sin(d.a)*d.r);d.s.visible=i>=9});
 /* reactor glow */
 coilMat2.emissiveIntensity=i>=10?(i===10?1.8*cl((t-ST[10]-.5)/1.5,0,1):1.1):0;
 /* sensor */
 {const rej=rejectOn(t);ledMat.color.set(rej?0xff3b3b:0x33ff88);ledMat.emissive.set(rej?0xff3b3b:0x33ff88);scr(rej?'GAGAL':'OK',rej?'#ff5b5b':'#5bff9c')}
 /* tank fill */
 {const u=i<12?0:cl((t-ST[12])/(TOTAL-ST[12]),0,1);tankLiq.scale.y=1+u*22;tankLiq.position.y=2.9+u*11}
 /* flows */
 FLOWS.forEach(f=>{const on=f.on(t);f.arr.forEach((s,k)=>{s.visible=on;if(on)s.position.copy(f.curve.getPoint(((t*f.speed)+k/f.arr.length)%1))})});
 /* final pouch bob */
 pouchM.position.y=30+Math.sin(t*1.2)*1.4;pouchM.rotation.set(Math.sin(t*.8)*.1,Math.sin(t*.5)*.25,Math.sin(t*.6)*.06);

 /* camera */
 {let [P1,T1]=camAt(i,t);if(i>0){const p=e3(cl((t-ST[i])/1.0,0,1));if(p<1){const [P0,T0]=camAt(i-1,t);P1=P0.lerp(P1,p);T1=T0.lerp(T1,p)}}
  cam.position.copy(P1);cam.lookAt(T1)}
 R.render(scene,cam);

 /* overlay */
 let txt='',cst=ST[i];CH[i].forEach((c,k)=>{if(t>=CHT[i][k][0]){txt=c;cst=CHT[i][k][0]}});cap.textContent=txt;
 cap.style.transform=`scale(${(0.94+0.06*bk(cl((t-cst)/.14,0,1))).toFixed(4)})`;
 const hbE=ST[2]-.3;hb.style.opacity=(t<hbE?cl(t/.35,0,1):cl(1-(t-hbE)/.28,0,1)).toFixed(3);
 hb.style.transform=`translateX(-50%) rotate(-2deg) scale(${(0.55+0.45*bk(cl(t/.5,0,1))).toFixed(3)})`;
 const c=CHIP[i];if(c){const a1=ST[i]+.3,b1=SEND[i]-.25,o=t<a1?0:t>b1?cl(1-(t-b1)/.25,0,1):cl((t-a1)/.3,0,1);
  chip.textContent=c;chip.style.opacity=o.toFixed(3);chip.style.transform=`translateX(-50%) rotate(1.5deg) scale(${(0.6+0.4*bk(cl((t-a1)/.38,0,1))).toFixed(3)})`}
 else chip.style.opacity=0;
 const d=t-ST[i];flash.style.opacity=(i>1&&d>=0&&d<.16?(1-d/.16)*.14:0).toFixed(3);
}
window.__render=render;window.__TOTAL=TOTAL;render(0);window.__ready=1;
if(!location.search.includes('capture')){let t0=null;const loop=ts=>{if(t0===null)t0=ts;let t=(ts-t0)/1000;if(t>TOTAL+1){t0=ts;t=0}render(t);requestAnimationFrame(loop)};requestAnimationFrame(loop)}
